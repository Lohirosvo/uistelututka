<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suojaisa vesi</title>
<style>
:root{ --tausta:#061018; --paneeli:#0b1a26; --viiva:rgba(120,170,200,.22);
  --teksti:#e8f2f8; --himmea:#8aa8bb; --korostus:#5ec8e5; }
*{box-sizing:border-box}
body{margin:0;background:var(--tausta);color:var(--teksti);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:8px;max-width:760px;margin:0 auto;font-size:14px}
.ylapalkki{display:flex;gap:6px;align-items:center;margin-bottom:6px}
select{flex:1;min-width:0;padding:6px;background:#0e2230;color:var(--teksti);
  border:1px solid var(--viiva);border-radius:5px;font-size:13px}
button{background:#12384a;color:var(--teksti);border:1px solid var(--viiva);
  border-radius:5px;padding:6px 10px;font-size:13px;font-weight:600;white-space:nowrap}
button:disabled{opacity:.5}
canvas{width:100%;height:auto;display:block;border:1px solid var(--viiva);
  border-radius:5px;image-rendering:pixelated;background:#03080d;max-height:62vh;
  object-fit:contain}
.ohjain{margin-top:6px}
.jana{display:flex;height:14px;margin:4px 0 2px;border:1px solid var(--viiva);
  border-radius:3px;overflow:hidden}
.jana i{flex:1;min-width:0}
.jana i.kohta{outline:2px solid var(--teksti);outline-offset:-2px}
input[type=range]{width:100%;height:28px;accent-color:var(--korostus);
  background:transparent;margin:0;display:block}
.lukema{font-family:ui-monospace,monospace;font-size:15px;font-weight:700;
  text-align:center;line-height:1.35;margin:2px 0}
.piste{font-family:ui-monospace,monospace;font-size:12.5px;text-align:center;
  color:var(--korostus);line-height:1.4;min-height:18px;margin-top:2px}
.pieni{font-size:11px;color:var(--himmea);text-align:center;line-height:1.4}
.reunat{display:flex;justify-content:space-between;font-size:10px;color:var(--himmea)}
.selite{display:flex;flex-wrap:wrap;gap:8px;font-size:10.5px;color:var(--himmea);
  justify-content:center;margin-top:5px}
.selite i{display:inline-block;width:10px;height:10px;border-radius:2px;
  margin-right:3px;vertical-align:-1px}
details{margin-top:8px;border-top:1px solid var(--viiva);padding-top:6px}
summary{font-size:12px;color:var(--himmea);cursor:pointer;padding:3px 0}
.kentta{margin:6px 0}
label{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--himmea);margin-bottom:2px}
.huom{font-size:11px;color:var(--himmea);line-height:1.5;margin-top:6px}
</style>
</head>
<body>

<div class="ylapalkki">
  <select id="jarvi"></select>
  <button id="hae">Hae 48 h</button>
</div>
<div class="ylapalkki">
  <select id="vene"></select>
</div>

<canvas id="kartta" width="127" height="241"></canvas>

<div class="ohjain">
  <div id="janaOsa" style="display:none">
    <div id="jana" class="jana"></div>
    <div class="reunat"><span id="janaA"></span><span id="janaB"></span></div>
    <input type="range" id="aika" min="0" max="48" step="1" value="0">
  </div>
  <div class="lukema" id="lukema">—</div>
  <div class="piste" id="piste">Napauta karttaa: kertoo sen kohdan aallon</div>
  <div class="pieni" id="teksti"></div>
  <div class="selite">
    <span><i style="background:#2ea043"></i>uisteltavissa</span>
    <span><i style="background:#f0b429"></i>vain kuljettavissa</span>
    <span><i style="background:#c9382e"></i>yli turvarajan</span>
  </div>
</div>

<details>
  <summary>Kalastusraja ja käsisäätö</summary>
  <div class="kentta">
    <label>Kalastusraja · <span id="kalaL"></span> · venekohtainen, sama kaikilla järvillä</label>
    <input type="range" id="kala" min="0.10" max="0.60" step="0.01" value="0.20">
  </div>
  <div class="kentta">
    <label>Käsisäätö · tuulen suunta <span id="dirL"></span></label>
    <input type="range" id="dir" min="0" max="355" step="5" value="225">
  </div>
  <div class="kentta">
    <label>Käsisäätö · tuulen nopeus <span id="uL"></span></label>
    <input type="range" id="u" min="2" max="18" step="0.5" value="8">
  </div>
  <button id="kasin">Käytä käsisäätöä</button>
  <div class="huom" id="huom"></div>
</details>

<script>
const JARVET = [
  { id:'47.031', nimi:'Lappajärvi', lat:63.14378, lon:23.53885,
    ruutu:100, W:127, H:241, syvyys:7.4,
    maski:'AAAAAAAAAAAAAAAAAAAAAAAAAAADAAAAAAAAAAAAAAAAAAAAA4AAAAAAAAAAAAAAAAAAAAMAAAAAAAAAAAAAAAAAAAABIAAAAAAAAAAAAAAAAAAAB0AAAAAAAAAAAAAAAAAAAA7AAAAAAAAAAAAAAAAAAAAJAAAAAAAAAAAAAAAAAAAAH2AAAAAAAAAAAAAAAAAAAA/gAAAAAAAAAAAAAAAAAABP4AAAAAAAAAAAAAAAAAAAf8AAAAAAAAAAAAAAAAAAAM+AAAAAAAAAAAAAAAAAAAMH4AAAAAAAAAAAAAAAAAADD+AAAAAAAAAAAAAAAAAABg/gAAAAAAAAAAAAAAAAAA4f4AAAAAAAAAAAAAAAAAAcP8AAAAAAAAAAAAAAAAAAPH+AAAAAAAAAAAAAAAAAADn+AAAAAAAAAAAAAAAAAABz+AAAAAAAAAAAAAAAAAAAZ/AAAAAAAAAAAAAAAAAAAM/wAAAAAAAAAAAAAAAAAAEf4AAAAAAAAAAAAAAAAAAAP+AAAAAAAAAAAAAAAAAAAH/gAAAAAAAAAAAAAAAAAAD/wAAAAAAAAAAAAAAAAAAL/8AAAAAAAAAAAAAAAAAAO//AAAAAAAAAAAAAAAAAAD//gAAAAAAAAAAAAAAAAAB//+AAAAAAAAAAAAAAAAAA///wAAAAAAAAAAAAAAAAAP//4AAAAAAAAAAAAAAAAAH5/8AAAAAAAAAAAAAAAAAD+f/AAAAAAAAAAAAAAAAAB/H/gAAAAAAAAAAAAAAAAA/h/4AAAAAAAAAAAAAAAAAfw//4AAAAAAAAAAAAAAAAP8f/8AAAAAAAAAAAAAAAAD+P//AAAAAAAAAAAAAAAAB/H//+AAAAAAAAAAAAAAAA/h///gAAAAAAAAAAAAAAA/9///4AAAAAAAAAAAAAAA/+////AAAAAAAAAAAAAAA//////gAAAAAAAAAAAAAAf/////wAAAAAAAAAAAAAAP/////4AAAAAAAAAAAAAAHf/////8AAAAAAAAAAAAAD3////7/AAAAAAAAAAAAABt//////4AAAAAAAAAAAAA///////+AAAAAAAAAAAAAf///////AAAAAAAAAAAAAH///////gAAAAAAAAAAAAB//8f///wAAAAAAAAAAAAAf/+P///4AAAAAAAADAAAAH//H///8AAAAAAAAF4AAAI//jv//+AAAAAAAAC+AAAAH/x5///AAAAAAAAAfgAAAD///f//YAAAAAAAAPwAAAD//////tAAAAAAAAD8AAAH//////nwAAAAAAAB+AAAD////////gAAAAAAA/AAAD//////+/+AAAAAAAYAAAB/////////AAAAAAAMAAAAf////////gAAAAAAHBAAC/////////wAAAAAADxwAA/////////8AAAAAGA/4AAf///////+/gAAAAHgD8AA////////9/4AAAADwB8AAP/////////8AAAAB4B8ADD//////////gAAAB8A8AJA//v///////8AAAA+AfAHAG/3///////+AAAAfgfIPAA////v/////AAAAPwf+PAAPv//n/////gAAAH4f//gADz//7/////4AAAD+P//wAB5////////+AAAA/n+f4AAIf///////8AAAB///n8AAAf////////AAAA///wMAAAP////////AAAA///8AAAAf///P////wAAAf///AAAAP///n////gAAAP///AAAAD///7////wAAAH///gAAAB////////4AAAB///gAAAA////////8AAAA///gAAAAff//////8AAAAP//AAAAAP/vf////8AAAAD//AAAAA3/wP////+AAAAD//AAAAAf/8H/////AAAAB/8AAAAAf/+D/////wAAAA//AAAAAH//g/////8AAAA//gAAAAB//w//////AAAA//4AAAAAf/+//////wAAH//+AAAAAH////////4AAD///gAAAAH////////+AAB///wAAAAH/////////AAA///8AAAAD/////////gAAf///gAAAD/////////gAAf///4AAAB/////////gAA////8AAAA/////////wAA////8AAAAf////////wAAf////AAAAO////////wAAP////gAAAHP///////wAAH////4AAAD3+//////wAAD////8AAAA////////4AAB////+AAAAfz//////8AAAf////gAAAP5//////+AAAP////8AAAH////////AAAH////+AAAD////////wAAD/////wAAB////////8AAB/////+AAH/////////gAA//////gAD/////////4AA//////wAD/////////8AAf/////8ABf+///////+AAP//////AA//P///////AAH//////gAf/v///////gAB//////4AP/////////wAA//////8AD/////////4AAf//////AB/////////4AAP//////gA/H///////+AAH//////wAfD////////AAD//////4AHz////////gAD//////8AAH////////+AD///////ADn/////////AB///////gB3/////////4Af//////4A//////////+AP//////8Af/////////8AP//////+AP/////////4AH//////+GH/////////8AD///////DD/////////+AD///////xx//////////gB///////94//////////wAf///////+f/////////wAH////////v/////////4AD//////////////////QAB//////////////////gAA//////////////////gAAf/////////////////4AAP/////////////////8AAH//////////////////gAD//////////////////wAB//////////////////4AAf/////////////////8AAf/////////////////+AAH/////////////////+AAB//////////////////AAA//////////////////wAAf/////////////////8OAP//////////////////3AH///////////////////gB///////////////////4AP//////////////////8AD//////////////////+gB///////////////////YAf//////////////////8AP//////////////////+AD///////////////////AA///////////////////AAP//////////////////AAD//////////////////gAB//////////////////wAB//////////////////8AA//////////////////8AAP//////////////////gAD//////////////////wAA//////////////////wAAf/////////////////8AAP/////////////////8AAD//////8//////////+AAA/////////////////6AAAf////////////////4AAAA////////////////8AAAAP///////////////+AAAAH/////////////v/+AAAAAP//////////////+AAAAAH////////v+/////AAAAAD////////z+/////gAAAAB////////5+f////AAAAAAf///////+/H////gAAAAAP/////////n////4AAAAAH/////////j//3/8AAAAAD/////////x//5/8AAAAAB////////////4/+AAAAAAP///////////8P/AAAAAAH///////////8D/gAAAAAH///////////wA/gAAAAAB///////////4APAAAAAAAP//////////8AAAAAAAAAH//////////+AAAAAAAAABf/////////+AAAAAAAAAAH////P////+AAAAAAAAAAD////n////OAAAAAAAAAAB///////f/gAAAAAAAAAAA///////P4gAAAAAAAAAAAf/////+DwAAAAAAAAAAAAP//////hgAAAAAAAAAAAAD//////wAAAAAAAAAAAAAAf/////wAAAAAAAAAAAAAAP/////4AAAAAAAAAAAAAAH/////+AAAAAAAAAAAAAAH/////+AAAAAAAAAAAAAAB/////AAAAAAAAAAAAAAAA////xgAAAAAAAAAAAAAAAf///4AAAAAAAAAAAAAAAAP///4AAAAAAAAAAAAAAAAH///8AAAAAAAAAAAAAAAAD///+AAAAAAAAAAAAAAAAB////gAAAAAAAAAAAAAAAA////wAAAAAAAAAAAAAAAAf///8AAAAAAAAAAAAAAAAf///wAAAAAAAAAAAAAAAAH///8AAAAAAAAAAAAAAAAD///+AAAAAAAAAAAAAAAAB///7AAAAAAAAAAAAAAAAA///8gAAAAAAAAAAAAAAAAf//+AAAAAAAAAAAAAAAAAH///AAAAAAAAAAAAAAAAAH///wAAAAAAAAAAAAAAAAB///4AAAAAAAAAAAAAAAAB//+wAAAAAAAAAAAAAAAAA///IAAAAAAAAAAAAAAAAAf//4AAAAAAAAAAAAAAAAAP///AAAAAAAAAAAAAAAAAH//+gAAAAAAAAAAAAAAAAB///gAAAAAAAAAAAAAAAAAf//4AAAAAAAAAAAAAAAAAf//+AAAAAAAAAAAAAAAAAP//+AAAAAAAAAAAAAAAAAD///AAAAAAAAAAAAAAAAAB///AAAAAAAAAAAAAAAAAA///gAAAAAAAAAAAAAAAAAf//wAAAAAAAAAAAAAAAAAP//4AAAAAAAAAAAAAAAAAH//+AAAAAAAAAAAAAAAAAB//8AAAAAAAAAAAAAAAAAA//8AAAAAAAAAAAAAAAAAAf/+AAAAAAAAAAAAAAAAAAP/+AAAAAAAAAAAAAAAAAAD/+AAAAAAAAAAAAAAAAAAA/IgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' },
  { id:'44.092', nimi:'Hirvijärven tekoallas', lat:62.775, lon:23.011,
    ruutu:100, W:50, H:78, syvyys:3.5,
    maski:'AAAAAAEAAAAAAABgAAAAAAA4AAAAAAAfMAAAAAAf/4AAAAAH/8AAAAAH//AAAAAP//4AAAAP//6AAAAf///AAAB////QAAB////4AAAP///8AAADn//jgAAA5//wwAAADf/4AAAAA3//AAAAAN//wAAAAJ//8AAAAOf//wAAAD3//4AAAB///+AAAA////4AAAD5//+AAAA8///gAAAPf//4AAAD3//4AAAAf///AAAAH///wAAAA///+AAAAP///AB+AB///wB/g///+AAf/////AAH////8AAD////+AAAf////gAAD////8AAA/////AAAH////wAAA////8AAAH////AAAB////wAAAH///8AAAA////AAAAH///wAAAA///8AAAAH///AAAAA///4AAAAH///AAAAA///4AAAAH//7gAAAB///gAAAAP//4AAAAB//+AAAAAP//AAAAAB//gAAAAAf/8AAAAAD/8AAAAAA/4AAAAAAP8AAAAAAD+AAAAAAAfgAAAAAAH8AAAAAAB/AAAAAAAfwAAAAAAH+AAAAAAA/wAAAAAAP8AAAAAAD7AAAAAAA4QAAAAAAOAAAAAAADgAAAAAAA8AAAAAAAPAAAAAAADwAAAAAAA+AAAAAAACAAAAA=' }
];

const g = 9.81;
const SUUNNAT = ['P','KO','I','KA','E','LO','L','LU'];
const PITKA = ['pohjoispäässä','koillisrannalla','itärannalla','kaakkoispäässä',
  'eteläpäässä','lounaisrannalla','länsirannalla','luoteispäässä'];

/* VENEET. turva = kestääkö runko. kalaOletus = se aalto jossa uistelu on vielä
   kalastusta eikä työtä — varovainen arvio pyytävän alueen rajasta, ei veneen kyky.
   RAJA ON VENEKOHTAINEN, EI JÄRVIKOHTAINEN: sama vene ja sama porukka kestää
   saman aallon riippumatta siitä kummalla järvellä ollaan. Aalto on aalto. */
const VENEET = [
  { id:'paijan470', nimi:'Päijän 470/471 · sähkö', turva:0.30, kalaOletus:0.15 },
  { id:'paijan520', nimi:'Päijän 520 · 10 hv',     turva:0.40, kalaOletus:0.18 },
  { id:'sunbuster', nimi:'Sun Buster · 30 hv',      turva:0.50, kalaOletus:0.20 },
  { id:'ph500',     nimi:'Pilothouse 500 · 80 hv',  turva:0.60, kalaOletus:0.20 },
  { id:'dorado100', nimi:'Silver Dorado · 100 hv',  turva:0.60, kalaOletus:0.20 }
];
const LS_RAJAT = 'aaltokartta_kalastusrajat', LS_VENE = 'aaltokartta_vene',
      LS_JARVI = 'aaltokartta_jarvi';

function lueRajat(){
  try{ const r = JSON.parse(localStorage.getItem(LS_RAJAT)); return r && typeof r === 'object' ? r : {}; }
  catch(e){ return {}; }
}
function tallennaRaja(id, arvo){
  try{ const r = lueRajat(); r[id] = arvo; localStorage.setItem(LS_RAJAT, JSON.stringify(r)); }catch(e){}
}
const vene = () => VENEET[document.getElementById('vene').selectedIndex] || VENEET[3];
const jarvi = () => JARVET[document.getElementById('jarvi').selectedIndex] || JARVET[0];
function kalastusraja(v){
  const r = lueRajat();
  return (typeof r[v.id] === 'number') ? r[v.id] : v.kalaOletus;
}

(function(){
  const jv = document.getElementById('jarvi');
  JARVET.forEach(j => { const o = document.createElement('option'); o.textContent = j.nimi; jv.appendChild(o); });
  try{ const t = localStorage.getItem(LS_JARVI);
       const k = JARVET.findIndex(j => j.id === t); if(k >= 0) jv.selectedIndex = k; }catch(e){}
  const sel = document.getElementById('vene');
  VENEET.forEach(v => { const o = document.createElement('option');
    o.textContent = v.nimi + ' · turva ' + v.turva.toFixed(2).replace('.',',') + ' m'; sel.appendChild(o); });
  let i = 3;
  try{ const t = localStorage.getItem(LS_VENE);
       const k = VENEET.findIndex(v => v.id === t); if(k >= 0) i = k; }catch(e){}
  sel.selectedIndex = i;
})();

/* JÄRVEN TILA. Maski, sektorijako ja pyyhkäisykenttien välimuisti rakennetaan
   kerran per järvi ja pidetään muistissa, jotta järven vaihto edestakaisin ei
   laske samaa uudestaan. */
const tilat = {};
function tila(){
  const j = jarvi();
  if(tilat[j.id]) return tilat[j.id];
  const raaka = atob(j.maski), mask = new Uint8Array(j.W*j.H);
  for(let i=0;i<mask.length;i++) mask[i] = (raaka.charCodeAt(i>>3) >> (7-(i&7))) & 1;
  let vesi = 0, ic = 0, jc = 0;
  for(let b=0;b<j.H;b++) for(let a=0;a<j.W;a++) if(mask[b*j.W+a]){ vesi++; ic+=a; jc+=b; }
  ic/=vesi; jc/=vesi;
  const sekt = new Int8Array(j.W*j.H).fill(-1);
  for(let b=0;b<j.H;b++) for(let a=0;a<j.W;a++){
    const q = b*j.W+a; if(!mask[q]) continue;
    let br = Math.atan2(a-ic, -(b-jc))*180/Math.PI; if(br<0) br+=360;
    sekt[q] = Math.round(br/45)%8;
  }
  return (tilat[j.id] = { j, mask, sekt, vesi, kentat:{} });
}

const jonswapHs = (F,U) => 0.0016*Math.sqrt(g*F/(U*U))*U*U/g;
const syvyysKatto = (d,U) => 0.283*(U*U/g)*Math.tanh(0.53*Math.pow(g*d/(U*U),0.75));

function kentta(suunta){
  const t = tila(), { j, mask } = t, W = j.W, H = j.H;
  if(t.kentat[suunta]) return t.kentat[suunta];
  const rad = (suunta+180)*Math.PI/180;
  const ux = Math.sin(rad), uy = -Math.cos(rad), px = -uy, py = ux;
  const k = new Float32Array(W*H);
  const dia = Math.ceil(Math.sqrt(W*W+H*H)), cx = W/2, cy = H/2;
  for(let n=-dia;n<=dia;n++){
    let sx = cx+px*n-ux*dia/2, sy = cy+py*n-uy*dia/2, jakso = 0;
    for(let s=0;s<dia;s++){
      const a = Math.round(sx+ux*s), b = Math.round(sy+uy*s);
      if(a<0||a>=W||b<0||b>=H){ jakso=0; continue; }
      const q = b*W+a;
      if(mask[q]){ jakso++; const m = jakso*j.ruutu; if(m>k[q]) k[q]=m; } else jakso=0;
    }
  }
  for(let b=0;b<H;b++) for(let a=0;a<W;a++){
    const q=b*W+a; if(!mask[q]||k[q]>0) continue;
    let paras=0;
    for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
      const bb=b+dy, aa=a+dx; if(bb<0||bb>=H||aa<0||aa>=W) continue;
      const n2=bb*W+aa; if(mask[n2]&&k[n2]>paras) paras=k[n2];
    }
    k[q] = paras || j.ruutu;
  }
  return (t.kentat[suunta] = k);
}

const cv = document.getElementById('kartta');
const ctx = cv.getContext('2d');
let kuva = null, ennuste = null, kasinTila = false, valittu = null;

const kello = d => String(d.getHours()).padStart(2,'0') + ':00';
const pv = d => ['su','ma','ti','ke','to','pe','la'][d.getDay()];
const nro = x => x.toFixed(2).replace('.',',');

function piirra(){
  const t = tila(), j = t.j, W = j.W, H = j.H, mask = t.mask;
  if(cv.width !== W || cv.height !== H || !kuva){
    cv.width = W; cv.height = H; kuva = ctx.createImageData(W, H);
  }
  const v = vene(), turva = v.turva, kala = Math.min(kalastusraja(v), turva);
  document.getElementById('kalaL').textContent = nro(kala) + ' m';
  document.getElementById('kala').value = kala;

  let dir, U, otsikko = '', lisa = '';
  if(ennuste && !kasinTila){
    const i = Math.min(ennuste.length-1, +document.getElementById('aika').value);
    const r = ennuste[i];
    dir = Math.round(r.WindDirection/5)*5 % 360; U = r.WindSpeedMS;
    otsikko = pv(r.aika) + ' ' + kello(r.aika) + ' · ';
    lisa = U.toFixed(1).replace('.',',') + ' m/s ' + SUUNNAT[Math.round(r.WindDirection/45)%8]
      + (r.WindGust != null ? ' · puuskat ' + r.WindGust.toFixed(0) : '');
    const p = document.getElementById('jana').children;
    for(let n=0;n<p.length;n++) p[n].classList.toggle('kohta', n === i);
  } else {
    dir = +document.getElementById('dir').value; U = +document.getElementById('u').value;
    lisa = U.toFixed(1).replace('.',',') + ' m/s ' + SUUNNAT[Math.round(dir/45)%8] + ' · käsisäätö';
  }
  document.getElementById('dirL').textContent = dir + '° ' + SUUNNAT[Math.round(dir/45)%8];
  document.getElementById('uL').textContent =
    (+document.getElementById('u').value).toFixed(1).replace('.',',') + ' m/s';

  const ke = kentta(dir), katto = syvyysKatto(j.syvyys, U), d = kuva.data;
  let kalastaa = 0, kulkee = 0, summa = new Float64Array(8), lkm = new Int32Array(8);
  let pienin = 99, suurin = 0;
  for(let q=0;q<W*H;q++){
    const o = q*4;
    if(!mask[q]){ d[o]=8; d[o+1]=16; d[o+2]=24; d[o+3]=255; continue; }
    const hs = Math.min(jonswapHs(Math.max(ke[q],50), U), katto);
    if(hs < pienin) pienin = hs; if(hs > suurin) suurin = hs;
    summa[t.sekt[q]] += hs; lkm[t.sekt[q]]++;
    let c;
    if(hs <= kala){ kalastaa++; kulkee++; c = [46,160,67]; }
    else if(hs <= turva){ kulkee++; c = [240,180,41]; }
    else c = [201,56,46];
    d[o]=c[0]; d[o+1]=c[1]; d[o+2]=c[2]; d[o+3]=255;
  }
  ctx.putImageData(kuva, 0, 0);

  const pEl = document.getElementById('piste');
  if(valittu && valittu.i < W && valittu.j < H){
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(valittu.i + 0.5, valittu.j + 0.5, 3.5, 0, 6.2832);
    ctx.moveTo(valittu.i - 6.5, valittu.j + 0.5); ctx.lineTo(valittu.i - 2.5, valittu.j + 0.5);
    ctx.moveTo(valittu.i + 3.5, valittu.j + 0.5); ctx.lineTo(valittu.i + 7.5, valittu.j + 0.5);
    ctx.stroke();
    const q = valittu.j*W + valittu.i;
    if(!mask[q]) pEl.textContent = 'Maata — napauta vesialuetta';
    else {
      const hs = Math.min(jonswapHs(Math.max(ke[q],50), U), katto), F = ke[q];
      pEl.innerHTML = 'Tässä kohdassa <b>' + nro(hs) + ' m</b>'
        + (hs <= kala ? ' · uisteltavissa' : hs <= turva ? ' · vain kuljettavissa' : ' · yli turvarajan')
        + '<br><span style="color:var(--himmea)">avointa vettä tuulen suuntaan '
        + (F >= 1000 ? (F/1000).toFixed(1).replace('.',',') + ' km' : Math.round(F) + ' m')
        + ' · huiput noin ' + nro(hs*1.8) + ' m</span>';
    }
  } else pEl.textContent = 'Napauta karttaa: kertoo sen kohdan aallon';

  let paras = null, arvo = Infinity;
  for(let s=0;s<8;s++) if(lkm[s] && summa[s]/lkm[s] < arvo){ arvo = summa[s]/lkm[s]; paras = s; }
  const pK = Math.round(kalastaa/t.vesi*100), pA = Math.round(kulkee/t.vesi*100);
  const el = document.getElementById('lukema');
  el.textContent = otsikko + pK + ' % uisteltavissa';
  el.style.color = pK >= 25 ? '#2ea043' : pK > 0 ? '#f0b429' : '#c9382e';
  document.getElementById('teksti').innerHTML = lisa + '<br>'
    + (pK === 0 ? 'Ei uistelukelpoista vettä' : 'Suojaisin ' + PITKA[paras])
    + ' · kuljettavissa ' + pA + ' % · aalto ' + nro(pienin) + '–' + nro(suurin) + ' m';
  document.getElementById('huom').innerHTML =
    j.nimi + ': ruutu ' + j.ruutu + ' m, ' + t.vesi + ' vesiruutua ('
    + (t.vesi*j.ruutu*j.ruutu/1e6).toFixed(0) + ' km²), syvyysparametri ' + j.syvyys + ' m. '
    + 'Kalastusraja on venekohtainen eikä muutu järven mukana: aalto on aalto. '
    + 'Matala järvi tuottaa pienemmän aallon samalla tuulella, ja se näkyy kartassa '
    + 'itsestään — rajaa ei tarvitse laskea.'
    + '<br><br>Kartta ei tiedä puuskia, virtauksia eikä kumpuamista. Se kertoo aallon, ei kalan.'
    + '<br><br><b>Rajan kalibrointi:</b> merkitse vesillä kellonaika, paikka ja arvio '
    + '(hyvä / rajalla / ei). Kotona hae ennuste, siirrä liuku siihen tuntiin ja napauta '
    + 'karttaa siitä kohdasta. Luku on merkitsevä aallonkorkeus Hs eli korkeimman '
    + 'kolmanneksen keskiarvo — yksittäiset huiput ovat noin 1,8-kertaisia, ja silmä '
    + 'mittaa juuri niitä. Kolme tai neljä merkintää riittää: raja on siinä välissä '
    + 'jossa hyvä muuttuu rajalla-tapauksiksi.';
}

function osuusTunnille(r, kala){
  const t = tila(), j = t.j;
  const ke = kentta(Math.round(r.WindDirection/5)*5 % 360);
  const katto = syvyysKatto(j.syvyys, r.WindSpeedMS);
  let n = 0;
  for(let q=0;q<j.W*j.H;q++){ if(!t.mask[q]) continue;
    if(Math.min(jonswapHs(Math.max(ke[q],50), r.WindSpeedMS), katto) <= kala) n++; }
  return n/t.vesi;
}
function piirraJana(){
  if(!ennuste) return;
  const kala = Math.min(kalastusraja(vene()), vene().turva);
  document.getElementById('jana').innerHTML = ennuste.map(r => {
    const o = osuusTunnille(r, kala);
    return '<i style="background:' + (o >= 0.25 ? '#2ea043' : o > 0.05 ? '#f0b429' : '#c9382e') + '"></i>';
  }).join('');
}

function hae(){
  const nappi = document.getElementById('hae'), j = jarvi();
  nappi.disabled = true; nappi.textContent = 'Haetaan…';
  fetch('https://opendata.fmi.fi/wfs?service=WFS&version=2.0.0&request=getFeature'
    + '&storedquery_id=fmi::forecast::harmonie::surface::point::simple'
    + '&latlon=' + j.lat + ',' + j.lon
    + '&parameters=WindSpeedMS,WindDirection,WindGust&timestep=60', { cache:'no-store' })
    .then(r => r.ok ? r.text() : Promise.reject(new Error('HTTP ' + r.status)))
    .then(txt => {
      const xml = new DOMParser().parseFromString(txt, 'application/xml');
      const NS = 'http://xml.fmi.fi/schema/wfs/2.0';
      const el = xml.getElementsByTagNameNS(NS, 'BsWfsElement');
      if(!el.length) throw new Error('ei kohteita');
      const hetket = new Map();
      for(let i=0;i<el.length;i++){
        const a = el[i].getElementsByTagNameNS(NS,'Time')[0];
        const n = el[i].getElementsByTagNameNS(NS,'ParameterName')[0];
        const v = el[i].getElementsByTagNameNS(NS,'ParameterValue')[0];
        if(!a||!n||!v) continue;
        const x = parseFloat(v.textContent); if(isNaN(x)) continue;
        const tt = a.textContent;
        if(!hetket.has(tt)) hetket.set(tt, { aika:new Date(tt) });
        hetket.get(tt)[n.textContent] = x;
      }
      ennuste = Array.from(hetket.values()).filter(r => r.WindSpeedMS != null)
        .sort((a,b) => a.aika - b.aika).slice(0,49);
      if(!ennuste.length) throw new Error('tyhjä vastaus');
      kasinTila = false;
      document.getElementById('janaOsa').style.display = '';
      document.getElementById('aika').max = ennuste.length - 1;
      document.getElementById('janaA').textContent = pv(ennuste[0].aika) + ' ' + kello(ennuste[0].aika);
      document.getElementById('janaB').textContent =
        pv(ennuste[ennuste.length-1].aika) + ' ' + kello(ennuste[ennuste.length-1].aika);
      nappi.textContent = 'Päivitä';
      piirraJana(); piirra();
    })
    .catch(e => { nappi.textContent = 'Hae 48 h';
      document.getElementById('teksti').textContent = 'Haku ei onnistunut: ' + e.message; })
    .then(() => { nappi.disabled = false; });
}

function napautus(x, y){
  const t = tila(), r = cv.getBoundingClientRect();
  const i = Math.floor((x - r.left) / r.width * t.j.W);
  const b = Math.floor((y - r.top) / r.height * t.j.H);
  if(i < 0 || i >= t.j.W || b < 0 || b >= t.j.H) return;
  valittu = { i, j:b };
  piirra();
}
cv.addEventListener('click', e => napautus(e.clientX, e.clientY));
cv.addEventListener('touchstart', e => {
  if(!e.touches.length) return;
  e.preventDefault(); napautus(e.touches[0].clientX, e.touches[0].clientY);
}, { passive:false });

document.getElementById('hae').addEventListener('click', hae);
document.getElementById('kasin').addEventListener('click', () => { kasinTila = true; piirra(); });
document.getElementById('aika').addEventListener('input', () => { kasinTila = false; piirra(); });
document.getElementById('kala').addEventListener('input', function(){
  tallennaRaja(vene().id, +this.value); piirraJana(); piirra();
});
document.getElementById('vene').addEventListener('change', function(){
  try{ localStorage.setItem(LS_VENE, vene().id); }catch(e){}
  piirraJana(); piirra();
});
/* Järven vaihto mitätöi ennusteen: se on haettu toisen järven koordinaateilla,
   eikä sitä saa esittää tämän järven tuulena. */
document.getElementById('jarvi').addEventListener('change', function(){
  try{ localStorage.setItem(LS_JARVI, jarvi().id); }catch(e){}
  ennuste = null; valittu = null; kuva = null;
  document.getElementById('janaOsa').style.display = 'none';
  document.getElementById('hae').textContent = 'Hae 48 h';
  piirra();
});
piirra();
</script>
