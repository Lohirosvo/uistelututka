  ===== TILANNEKUVA (tilanne.html) — 10.10.2026 (v179) =====
  Hannu 10.10.2026: tilannetietoisuudelle oma kevyt sivu, jotta pääsovellus ei kasva rajatta ja
  vesillä näkyy vain se, mitä siellä tarvitaan: kartta, oma sijainti ja kulkusuunta, aallokko
  (veneen kalastusraja), kloonipisteet ja seuraava kohde, ottipaikat. "Pyritään erinomaisuuteen ja laatuun."
  PERIAATTEET
    - Sama malli, ei kopiota: aalto, virtaus ja syvyys tulevat aaltomalli.js:stä (akRenderoi piirtää
      pohjakuvan samalla piirra()-funktiolla kuin aaltokortti), kloonit kloonit.js:stä, paikat paikat.js:stä.
    - Sama osoite kuin index.html, joten tallennukset ovat yhteiset (kloonit, vene ja kalastusraja,
      valittu paikka). Muutokset toisesta välilehdestä päivittyvät tänne (storage-tapahtuma).
    - Kartta piirretään tässä: pohjakuva kerran tunnissa/tilan vaihtuessa, päälle oma sijainti ja merkit
      vektoreina näytön tarkkuudella. Siirto ja zoomaus eivät laske mallia uudelleen.
    - Paikannus käynnistyy sivun auetessa ja näyttö pidetään päällä (Wake Lock). Selain keskeyttää
      paikannuksen, kun näyttö sammuu tai sivu on taustalla; sitä ei web-sovelluksessa voi kiertää.
  v180 (10.10.2026): KALA KIINNI tällä sivulla, täysi kirjaus (Hannu: "jatketaan" v179-suunnitelman mukaan).
    - Yksi napautus tallentaa heti saman rivin kuin etusivun Kala kiinni: rivi rakennetaan samalla funktiolla
      (kirjaus.js: rakennaSaalis). Etusivun tila (sää, vesi, kyselyn vastaukset, ennusteet, suositukset,
      harppaus- ja lämpötieto) tulee kirjauspohjasta, jonka etusivu tallentaa jäädessään taustalle; aika, GPS,
      nopeus, veneen kohdan pohja (syvyys.js) ja mallin arviot lasketaan tässä kirjaushetkellä.
    - Laji on viimeksi valittu (napissa näkyy). Kirjauksen jälkeen lajin voi vaihtaa yhdellä napautuksella ja
      kirjauksen poistaa (kaksi napautusta). Pituus ja syvyys täydennetään etusivun saalislistasta (✏️ Täydennä).
    - Kloonit samalla koodilla kuin etusivulla (kloonit.js): osuma aiempaan klooniin ja uudet kloonit.
    - Rivillä lisäksi kirjausLahde 'tilanne', kirjauspohjaAika ja gpsIkaS, jotta lähde ja tuoreus näkyvät.
    - Syvyyslukema sama kuin etusivulla (MML + oma luotaus, syvyys.js), päivän saaliit kartalla, ja avoimeen
      uistelureissuun (etusivun Aloita uistelu) kirjautuu GPS-piste kerran minuutissa myös tällä sivulla.
  v181 (10.10.2026): Hannu "haluan nyt kaikki": kaikki aaltokortin tilat (aalto, murtuva, pintavirta, syvempi vesi,
    vajoama, kumpuama, konvergenssi, syvyys) valikosta, väriselite kartan reunassa, napautus kertoo kohdan arvon
    samalla tekstillä kuin aaltokortti (akPisteTeksti), pinkki kumpuamisalue etusivun lämpötiedoista (kirjauspohja),
    ja lähtöpaikka päivän suunnitelmalle (napautus → ⚓, näkyy ankkurina).
  v182 (10.10.2026): VAAKA-ASETTELU. Hannu 10.10.: puhelin on telineessä vaakana, koska latausjohto asettuu niin
    paremmin; KALA oikeaan reunaan.
    - ↻-nappi: koko näyttö ja vaakalukko (screen.orientation.lock('landscape')). Standardin mukaan lukko toimii vain koko
      näytön tilassa, ja koko näyttö vaatii napautuksen. Lukko sallii molemmat vaaka-asennot anturin mukaan, joten
      johto voi olla kummalla puolella tahansa. Valinta muistetaan: kun sivu avataan uudelleen, ensimmäinen napautus
      palauttaa vaakanäkymän. Etusivu pysyy pystyssä (manifest.json ennallaan).
    - Vaakanäkymässä (leveämpi kuin korkea ja korkeus enintään 600 px) kartta saa koko korkeuden. Oikeassa reunassa on
      sarake: nopeus ja kurssi isolla, syvyys ja aalto, napit ja KALA alimpana. Järvi, tunti ja karttatila ovat pieninä
      kartan vasemmassa yläkulmassa. Kala kiinni -vahvistus, napautustieto ja tilavalikko aukeavat vasemmalle, eivät
      veneen päälle.
    - Pystynäkymä ennallaan (↻-nappi lisätty).
  v183 (10.10.2026): OMA VENE JA VANA. Hannu lähetti Beason 630 WA -kuvan: "paikan ilmaista tälläisellä iconilla joka näyttää
    suunnan minne menossa, 50 m häntä olisi plussaa mistä tullut, pituus ei niin tarkka hahmottamiseen riittävä."
    - Vihreän nuolen tilalla vene ylhäältä: valkoinen runko, tumma ohjaamo, perämoottori, syaani hehku ja tumma reunaviiva
      (erottuu kaikilla karttaväreillä). Piirretään vektorina, ei kuvatiedostoa. Keula GPS-kulkusuuntaan. Koko 44 px näytöllä.
    - Vana = oikea GPS-reitti veneen takana: vähintään 50 m ja aina vähintään 80 px, koska oletusnäkymässä (3 km leveys)
      50 m on alle 10 px ja jäisi veneen kuvan alle. Häipyy päätä kohti.
    - Paikallaan GPS-kohina ei piirrä kiemuraa: GPS:n oma nopeus alle 1 km/h ei lisää pisteitä eikä käännä venettä; uusi
      piste 5–15 m siirtymästä tarkkuuden mukaan (ilman GPS-nopeutta 10–20 m). Yli 40 m:n tarkkuus ei piirrä. Yli 3 min
      katko tai yli 100 km/h hyppy (GPS-virhe) aloittaa vanan alusta.
    - Vana on vain tämän välilehden muistissa (sessionStorage, enintään 45 min / 2 km), ei saalislokissa.
    - Vihreä ennusteviiva (5 min nykyisellä nopeudella, vähintään 30 px keulan edessä) vain, kun suunta on mitattu
      viimeisen minuutin aikana. Jos vene on seissyt, se näkyy haaleana viimeisimpään kulkusuuntaan. Ennen ensimmäistä
      liikettä merkki on pyöreä.
  v184 (10.10.2026): ALAPALKKI NÄKYVIIN. Hannun kuvakaappaus (S25 Ultra, ei osoiteriviä, kolmen napin navigointi):
    alapalkki (nopeus, syvyys, ◎ 🎯 ☾ ↻) jäi kokonaan Androidin navigointipalkin alle, joten ↻-nappia ei näkynyt.
    Syy: viewport-fit=cover. Sen kanssa Chrome (135→) ulottaa sivun ruudun alareunaan navigointipalkin alle, mutta
    env(safe-area-inset-bottom) oli kuvan mittojen mukaan 0, joten palkki ei noussut. viewport-fit=cover poistettu (kuten
    index.html:ssä, joka näkyy oikein): selain pitää sivun järjestelmäpalkkien välissä. env()-arvot jäävät koodiin
    (ilman coveria ne ovat 0). Vaakanäkymän koko näytössä kameran reikä jää nyt sivun ulkopuolelle (selain rajaa).
  v185 (10.10.2026): VENE JA VANA YHTEISEEN TIEDOSTOON (vene.js). Hannu valitsi "vene etusivun kartoille": aaltokortti ja
    syvyyskartta piirtävät nyt saman veneen ja vanan kuin tämä sivu. Koodi siirretty sanasta sanaan; tämän sivun kuva on
    bitilleen sama kuin v184:ssä (testattu). Vana on välilehden yhteinen (sessionStorage 'ut_vana', v183:n
    'tilanne_vana' luetaan kerran), joten etusivulla kuljettu reitti jatkuu tilannekuvassa ja päinvastoin.
  v193 (11.10.2026): KAIKULUOTAIMEN TALLENTEET: lämpöjälki (sininen–punainen) ja syöttikalaparvet (keltainen; oranssi =
    laite luki parven pohjaksi) kerroksina, napautus kertoo ajan ja syvyyden; alapalkissa veden lämpö uusimmasta tallenteesta.
  v193 (11.10.2026): KARTAN SEURANTA. Seurattaessa vene on kolmanneksen keskeltä reunaan kulkusuuntaa vastaan (edessä näkyy
    enemmän; kulkusuunta ylös → vene alakolmanneksen rajalla). Valikosta tai pohjoisnuolta napauttamalla kartta kääntyy

  v192 (10.10.2026): TOISTUVA ANALYYSI. Uistelun ollessa päällä analyysi toistetaan :00 ja :30 (tilanne 30 min eteenpäin)
    näkymättömässä etusivun kehyksessä; merkit päivittyvät ja paikan vaihtuessa tulee kuulutus ja tieto ruudulle.
  v191 (10.10.2026): ALAPALKKI PÄIVITYKSEN JÄLKEEN. Hannun puhelimessa alapalkki jäi kolmesti (16.08, 20.39, 21.09) heti
    päivityksen jälkeen Androidin navigointipalkin alle; sovelluksen sulkeminen ja avaaminen korjasi. Etusivun alavalikko
    (position: fixed; bottom: 0) näkyi samaan aikaan oikein. Runko kiinnitetään nyt samoin (position: fixed, ylä- ja

  v190 (10.10.2026): vain versionumero (korjaus etusivulla: syysohjeen reunat lasketaan uudelleen, kun ennuste on ladattu).
  v189 (10.10.2026): SYKSYN OHJE. Taimenpaikkoihin tulee sekoittuneessa 4–12 °C:n vedessä tuulen pakkaamat reunat (R-merkit,

  v188 (10.10.2026): ENNUSTEET TALTEEN (aaltomalli.js). Ilman verkkoa malli toimii puhelimeen tallennetulla ennusteella;

  v201 (13.10.2026): VANA SAALIIN KOHDALLE. Hannu: lohi seuraa usein ennen tärppiä, joten ottipiste on ajolinjalla

  <style>

       oikein. Alareuna nousee Chromen ohjeen mukaan env(safe-area-inset-bottom):n verran (Chrome 135→ "chin"). */
    body { display: flex; flex-direction: column; position: fixed; top: 0; left: 0; right: 0; bottom: env(safe-area-inset-bottom, 0px); height: auto; }

  <script>
  (function () {
    'use strict';
    const APP_VERSIO = 'v201';
    window.APP_VERSIO = APP_VERSIO;   // kloonit.js merkitsee iskuun laskeneen version
    const $ = id => document.getElementById(id);
    const AS_LS = 'tilanne_asetukset';
    // v181: kaikki aaltokortin tilat samassa järjestyksessä kuin siellä; [tila, napin teksti, valikon teksti]
    const TILAT = [['aalto', 'Aalto', 'Aalto'], ['murtuva', 'Murtuva', 'Murtuva aallokko'], ['virtaus', 'Virta', 'Pintavirtaus'], ['syva', 'Syvä', 'Syvempi vesi'],
                   ['vajoama', 'Vajoama', 'Vajoama'], ['kumpuama', 'Kumpuama', 'Kumpuama'], ['konvergenssi', 'Konverg.', 'Konvergenssi'], ['lampo', 'Lämpö', 'Lämpö (suunta)'], ['syvyys', 'Syvyys', 'Syvyyskartta']];   // v199: lämpö
    const PV = ['su', 'ma', 'ti', 'ke', 'to', 'pe', 'la'];
    const n1 = x => (Math.round(x * 10) / 10).toFixed(1).replace('.', ',');
    const n2 = x => (Math.round(x * 100) / 100).toFixed(2).replace('.', ',');
    const kk = n => String(n).padStart(2, '0');
    const ilmansuunta = deg => ['P', 'KO', 'I', 'KA', 'E', 'LO', 'L', 'LU'][Math.round((((deg % 360) + 360) % 360) / 45) % 8];   // mistä tuulee

    let as = { tila: 'aalto', kloonit: true, yo: false, laji: null, selite: false, vaaka: false, kuha: true, taimen: true, kulku: false, lampo: true, parvet: true, kalat: true, kivikko: true, lohi: true, saalisVanat: true };   // v201: saalisVanat (saaliin vana)   // v200: lohi (Lintuselän malli)   // v186: kuha, taimen; v193: kulku (kulkusuunta ylös), lampo, parvet; v194: kalat
    try { as = Object.assign(as, JSON.parse(localStorage.getItem(AS_LS) || '{}')); } catch (e) {}
    const tallennaAs = () => { try { localStorage.setItem(AS_LS, JSON.stringify(as)); } catch (e) {} };

    const cv = $('kartta'), ctx = cv.getContext('2d');
    let pohja = null;            // akRenderoi-tulos
    let nak = null;              // { s, x0, y0 }: näytön px = pohjan px · s + siirto
    let avain = null, tunti = 0, tuntiKasin = false, seuraa = true;
    let oma = null;              // { lat, lon, suunta, tarkkuus, kmh, aika }
    let kerros = null;           // klooniKerros
    let piirtoPyynto = false;
    /* v193 (11.10.2026, Hannu: "Kartan vieritys olisi hyvä olla 1/3 enemmän kulkusuuntaan keskikohtaa. Kartan kääntö
       kulkusuuntaan mahdollisuus auttaisi jossain tilanteessa." Valinta: vene alakolmannekseen + kääntönappi).
       - kierto: koko kartan kierto näytön keskipisteen ympäri (radiaaneja, myötäpäivään). Pohjoinen ylös = 0. Kulkusuunta
         ylös: kierto = −kulkusuunta, pehmennettynä (GPS:n suunta heiluu hitaassa vedossa). Merkit ja tekstit pysyvät pystyssä,
         koska ne piirretään naytolle()-pisteisiin; vain pohjakuva kierretään.
       - Seurattaessa vene ei ole keskellä, vaan kolmanneksen matkalla keskeltä reunaan kulkusuuntaa vastaan: kulkusuunta
         ylös → vene alakolmanneksen rajalla (2/3 korkeudesta), pohjoinen ylös → edessä näkyy kolmannes enemmän. */
    let kierto = 0;
    function tila(t) { $('tila').textContent = t; $('tila').style.display = t ? '' : 'none'; }
    function ilmoita(t) {
      const el = $('ilmoitus'); el.textContent = t; el.style.display = 'block';
      clearTimeout(ilmoita.aj); ilmoita.aj = setTimeout(() => { el.style.display = 'none'; }, 6000);
    }

    /* ---------- koordinaatit: lat/lon ↔ pohjakuvan pikseli ↔ näyttö ---------- */
    function pohjaPx(lat, lon) {
      const k = pohja.k, w = pohja.win, S = pohja.S;
      return { x: ((lon - k.lansiLon) * 111320 * Math.cos(lat * Math.PI / 180) / k.ruutu - w.i0) * S,
               y: ((k.pohjoisLat - lat) * 111320 / k.ruutu - w.j0) * S };
    }
    function kierra(x, y, a) {   // v193: piste näytön keskipisteen ympäri kulman a verran (myötäpäivään)
      const c = Math.cos(a), sn = Math.sin(a), cx = cv.clientWidth / 2, cy = cv.clientHeight / 2, dx = x - cx, dy = y - cy;
      return { x: cx + dx * c - dy * sn, y: cy + dx * sn + dy * c };
    }
    function naytolle(lat, lon) { const p = pohjaPx(lat, lon), u = { x: p.x * nak.s + nak.x0, y: p.y * nak.s + nak.y0 }; return kierto ? kierra(u.x, u.y, kierto) : u; }
    function latLon(sx, sy) {
      if (kierto) { const v = kierra(sx, sy, -kierto); sx = v.x; sy = v.y; }   // v193
      const k = pohja.k, w = pohja.win, S = pohja.S;
      const bx = (sx - nak.x0) / nak.s, by = (sy - nak.y0) / nak.s;
      const lat = k.pohjoisLat - (by / S + w.j0) * k.ruutu / 111320;
      return { lat, lon: k.lansiLon + (bx / S + w.i0) * k.ruutu / (111320 * Math.cos(lat * Math.PI / 180)) };
    }
    const mPerPx = () => pohja.k.ruutu / pohja.S / nak.s;   // metriä näytön pikselillä

    function sovitaJarvi() {
      const w = cv.clientWidth, h = cv.clientHeight, W = pohja.kuva.width, H = pohja.kuva.height;
      const s = Math.min(w / W, h / H) * 0.96;
      nak = { s, x0: (w - W * s) / 2, y0: (h - H * s) / 2 };
    }
    function keskita(lat, lon, leveysM, siirto) {   // siirto (v193): { x, y } näytön pikseleinä keskipisteestä
      const w = cv.clientWidth, h = cv.clientHeight;
      if (leveysM) nak.s = w * pohja.k.ruutu / (leveysM * pohja.S);
      const p = pohjaPx(lat, lon);
      let tx = w / 2, ty = h / 2;
      if (siirto) { const v = kierto ? kierra(w / 2 + siirto.x, h / 2 + siirto.y, -kierto) : { x: w / 2 + siirto.x, y: h / 2 + siirto.y }; tx = v.x; ty = v.y; }
      nak.x0 = tx - p.x * nak.s; nak.y0 = ty - p.y * nak.s;
    }
    // v193: veneen paikka näytöllä seurattaessa: kolmanneksen matka keskeltä reunaan kulkusuuntaa vastaan (kun suunta tiedetään)
    function veneSiirto() {
      if (!oma || typeof oma.suunta !== 'number') return null;
      const w = cv.clientWidth, h = cv.clientHeight, a = oma.suunta * Math.PI / 180 + kierto;
      const dx = Math.sin(a), dy = -Math.cos(a);   // kulkusuunta näytöllä
      const L = Math.min(Math.abs(dx) > 1e-6 ? (w / 2) / Math.abs(dx) : Infinity, Math.abs(dy) > 1e-6 ? (h / 2) / Math.abs(dy) : Infinity) / 3;
      return { x: -dx * L, y: -dy * L };
    }
    function keskitaVene(leveysM) { if (oma) keskita(oma.lat, oma.lon, leveysM, veneSiirto()); }
    // v193: kulkusuunta ylös: kierto seuraa kulkusuuntaa pehmennettynä (alle 3° muutokset ohitetaan, muuten 40 % kohti uutta)
    function paivitaKierto() {
      if (!as.kulku) { kierto = 0; return; }
      if (!oma || typeof oma.suunta !== 'number') return;
      const tavoite = -oma.suunta * Math.PI / 180;
      if (!paivitaKierto.alustettu) { paivitaKierto.alustettu = true; kierto = tavoite; return; }   // ensimmäinen suunta avauksen jälkeen: suoraan
      let d = tavoite - kierto; d = Math.atan2(Math.sin(d), Math.cos(d));
      if (Math.abs(d) < 3 * Math.PI / 180) return;
      kierto = Math.atan2(Math.sin(kierto + d * 0.4), Math.cos(kierto + d * 0.4));
    }
    function vaihdaKulku(paalle) {
      as.kulku = typeof paalle === 'boolean' ? paalle : !as.kulku; tallennaAs();
      if (as.kulku && oma && typeof oma.suunta === 'number') kierto = -oma.suunta * Math.PI / 180; else if (!as.kulku) kierto = 0;
      if (seuraa && oma && nak && pohja) keskitaVene();
      ilmoita(as.kulku ? (oma && typeof oma.suunta === 'number' ? 'Kulkusuunta ylös' : 'Kulkusuunta ylös, kun vene liikkuu') : 'Pohjoinen ylös');
      pyydaPiirto();
    }

    /* ---------- piirto ---------- */
    function pyydaPiirto() { if (piirtoPyynto) return; piirtoPyynto = true; requestAnimationFrame(() => { piirtoPyynto = false; piirra(); }); }
    function koko() {
      const dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
      if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      return { w, h };
    }
    function teksti(t, x, y, vari, koko, tausta) {
      ctx.font = '700 ' + (koko || 14) + 'px "Barlow Condensed", system-ui, sans-serif';
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.lineWidth = 3.5; ctx.strokeStyle = tausta || 'rgba(4,10,18,.85)'; ctx.strokeText(t, x, y);
      ctx.fillStyle = vari; ctx.fillText(t, x, y);
    }
    function salmiakki(x, y, r) { ctx.beginPath(); ctx.moveTo(x, y - r); ctx.lineTo(x + r, y); ctx.lineTo(x, y + r); ctx.lineTo(x - r, y); ctx.closePath(); }
    function pyorea(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

    /* ---------- v183: oma vene ja vana ----------
       v185: vana (GPS-pisteet, säännöt, välilehden muisti) ja piirto siirretty sanasta sanaan tiedostoon vene.js, jotta
       etusivun aaltokortti ja syvyyskartta piirtävät saman veneen. Tämä sivu antaa vain oman koordinaatistonsa:
       utPiirraVana(ctx, { oma, naytolle, mPerPx }) ja utPiirraVeneMerkki(ctx, { oma, p, mPerPx, yo }). */

    /* ---------- v186: kuha- ja taimenpaikat tilannekuvaan ----------
       Hannu 10.10. (valinta listalta): "Ehdokkaat tilannekuvaan". Etusivun Analysoi laskee kuhapaikat (nimetyt ja ehdokkaat
       syvyyskartasta) ja taimenpaikat (harppauskerroksen mallista) ja tallentaa ne perusteluineen kirjauspohjaan
       (P.kartta.kuha / .taimen, sama sisältö kuin aaltokortin merkeillä). Täällä ne piirretään samoin merkein, ja napautus
       kertoo nimen, lyhyen tekstin, perustelut todisteen tasoineen ja lähimmän nimetyn paikan.
       - Vain sama järvi. Paikat koskevat analyysin hetkeä (voi olla tuleva, esim. illalla aamuksi tehty suunnitelma);
         ne eivät vaihdu kartan tunnin mukana, kuten aaltokortissakaan. Yli 12 h menneisyydessä oleva hetki ei näy.
       - Valikossa (tilanappi) kytkimet 🐟 ja 🎣; oletus päällä. */
    const PAIKKALAJIT = ['kuha', 'taimen'], PAIKAT_MAX_MS = 12 * 3600e3;
    const hetkiTeksti = ms => { const d = new Date(ms); return PV[d.getDay()] + ' ' + d.getDate() + '.' + (d.getMonth() + 1) + '. klo ' + klooniKello(ms); };
    const jarvenNimi = a => (window.UT_JARVET && window.UT_JARVET[a] && window.UT_JARVET[a].nimi) || a || '–';
    function paikkaKartta(laji) {   // → { K: { avain, hetki, kohteet, syy } tai null, syy }
      const P = pohjaRajauksiin(), K = P && P.kartta ? P.kartta[laji] : null;
      if (!K || !Array.isArray(K.kohteet)) return { K: null, syy: 'ei laskettu: paina etusivulla Analysoi' };
      if (K.avain !== avain) return { K: null, syy: 'laskettu järvelle ' + jarvenNimi(K.avain) };
      if (Date.now() - K.hetki > PAIKAT_MAX_MS) return { K: null, syy: 'laskettu hetkelle ' + hetkiTeksti(K.hetki) + ', yli 12 h sitten' };
      if (!K.kohteet.length) return { K: null, syy: 'ei paikkoja' + (K.syy ? ', koska ' + K.syy : '') + ' (' + hetkiTeksti(K.hetki) + ')' };
      return { K, syy: '' };
    }
    function paikkaMerkki(laji, q, x, y) {   // aaltokortin merkit (akPiirraKuhaMerkit / akPiirraTaimenMerkit), kerroin 1
      const oma = q.tyyppi === 'oma', vt = q.tyyppi === 'vaihtoehto';
      const r = oma ? (q.paras ? 9 : 7.5) : (laji === 'kuha' ? 8 : 9.5);
      ctx.beginPath(); ctx.arc(x, y, r + 2.2, 0, 6.2832); ctx.fillStyle = 'rgba(255,255,255,.92)'; ctx.fill();
      ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832);
      ctx.fillStyle = laji === 'kuha' ? (oma ? '#f2a024' : '#ffffff') : (oma ? '#3d8fd6' : vt ? '#dbe9f7' : '#ffffff'); ctx.fill();
      if (vt) ctx.setLineDash([4, 4]);
      ctx.lineWidth = oma ? 1.6 : 2.6; ctx.strokeStyle = laji === 'kuha' ? (oma ? '#3b2700' : '#c27400') : (oma ? '#0b2f52' : '#1c6fb8'); ctx.stroke();
      if (vt) ctx.setLineDash([]);
      if (q.tunnus) {
        ctx.font = '700 ' + (laji === 'kuha' ? 11 : (q.tunnus.length >= 3 ? 8.5 : 10)) + 'px system-ui, sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = laji === 'kuha' ? '#1d1400' : '#0b2f52';
        ctx.fillText(q.tunnus, x, y + 0.5); ctx.textAlign = 'left';
      }
    }
    function paikkaTietoHtml(laji, K, q) {
      const syyt = (q.syyt || []).map(s => '<div class="syy"><span class="taso">' + s.taso + '</span>' + s.teksti + (s.p ? ' <span style="color:#7E93AC">(' + (s.p > 0 ? '+' : '') + s.p + ')</span>' : '') + '</div>').join('');
      return '<b style="color:' + (laji === 'kuha' ? '#ffc46b' : '#8fc4ff') + '">' + (laji === 'kuha' ? '🐟 ' : '🎣 ') + q.nimi + '</b>'
        + ' <span style="color:#7E93AC">(etusivun analyysi, ' + hetkiTeksti(K.hetki) + ')</span><br>' + q.teksti + syyt
        + (q.lahin ? '<div class="syy" style="color:#7E93AC">' + q.lahin + '</div>' : '');
    }

    /* ---------- v200: järvilohen kaistat (Lintuselän malli, aaltomalli.js akLohiKaistat) ----------
       Hannun Kivijärven Lintuselän kokemus: veneen alla 15–20 m, patti tai penkka noin 6 m:iin, veto penkan suuntaisesti,
       pintauistin. Kaistat lasketaan kartan tunnin tuulella (vaihtuvat tunnin mukana), syvyysruudukosta; ei vaadi Analysoi-nappia. */
    let lohiVM = { avain: null, k: '', L: null };
    function lohiKaistat() {
      if (typeof window.akLohiKaistat !== 'function' || !pohja) return null;
      const U = pohja.ennuste ? pohja.U : null, d = pohja.ennuste ? pohja.dir : null, k = avain + '|' + U + '|' + d;
      if (lohiVM.k === k) return lohiVM.L;
      let L = null; try { L = window.akLohiKaistat({ U, dir: d }); } catch (e) { L = null; }
      if (L && L.avain !== avain) L = null;
      lohiVM = { avain, k, L }; return L;
    }
    function lohiMerkki(q, nakyy) {
      const A = naytolle(q.a.lat, q.a.lon), B = naytolle(q.b.lat, q.b.lon), C = naytolle(q.lat, q.lon);
      if (!nakyy(C, 80)) return;
      ctx.save(); ctx.lineCap = 'round';
      [[9, 'rgba(40,8,0,.9)'], [5, '#ff7a45']].forEach(([lw, v]) => { ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y); ctx.lineWidth = lw; ctx.strokeStyle = v; ctx.stroke(); });
      ctx.restore();
      teksti(q.tunnus + ' ' + q.pisteet + '%', C.x + 10, C.y - 9, '#ffb38f', 14);
    }
    function lohiTietoHtml(L, q) {
      const syyt = q.syyt.map(s => '<div class="syy"><span class="taso">' + s.taso + '</span>' + s.teksti + '</div>').join('');
      return '<b style="color:#ff9e80">🐟 Järvilohi ' + q.tunnus + ' (' + q.pisteet + ' %)</b> <span style="color:#7E93AC">Lintuselän malli'
        + (L.tuuli ? ', tuuli ' + Math.round(L.tuuli.U) + ' m/s ' + ilmansuunta(L.tuuli.dir) : ', ei tuulta') + '</span><br>' + q.teksti + syyt;
    }

    // v193: lämpöjälki: sininen = kylmin, punainen = lämpimin näkyvistä tallenteista (väli vähintään 0,6 °C)

      return '<button class="merkki' + (as.saalisVanat && n ? ' valittu' : '') + '" data-merkit="saalisVanat"' + (n ? '' : ' disabled') + '>〰 Saaliiden vanat (' + n + ')</button>'
        + '<div class="huom">' + (n ? 'Viimeiset 500 m ennen Kala kiinni -kirjausta lajin värillä, häipyy alkua kohti. Lohi seuraa usein ennen tärppiä: linja kertoo enemmän kuin piste.'
          : 'Tämän päivän saaliilla ei ole vanaa. Vana tallentuu, kun GPS on ollut päällä ennen kirjausta (v201 alkaen).') + '</div>';
    }
    // v193: kaikuluotaimen tallenteiden kerrokset (7 vrk, tämä järvi)
    function tallenneValikko() {
      const L = typeof omaLuotausLampoJalki === 'function' ? omaLuotausLampoJalki(avain) : { pisteet: [] };
      const P = typeof omaLuotausParvet === 'function' ? omaLuotausParvet(avain) : [];
      const np = P.filter(x => x.tyyppi === 'parvi').length, npo = P.length - np, KI = isotKaiut(), KV = kivikkoJaksot(), KVt = KV.filter(q => q.taimen).length, KVk = KV.filter(q => q.taso >= 2).length;
      return '<div class="huom" style="margin-top:4px;color:var(--text)">Kaikuluotaimen tallenteet (7 vrk)</div>'
        + '<button class="merkki' + (as.lampo && L.pisteet.length ? ' valittu' : '') + '" data-kerros="lampo"' + (L.pisteet.length ? '' : ' disabled') + '>🌡 Lämpöjälki'
        + (L.pisteet.length ? ' (' + n1(L.min) + '–' + n1(L.max) + ' °C)' : '') + '</button>'
        + '<button class="merkki' + (as.parvet && P.length ? ' valittu' : '') + '" data-kerros="parvet"' + (P.length ? '' : ' disabled') + '>🐟 Parvet (' + np + (npo ? ' + ' + npo + ' pohjaksi luettua' : '') + ')</button>'
        + '<button class="merkki' + (as.kalat && KI.length ? ' valittu' : '') + '" data-kerros="kalat"' + (KI.length ? '' : ' disabled') + '>🎣 Isot kaiut (' + KI.length + ')</button>'
        + '<button class="merkki' + (as.kivikko && KV.length ? ' valittu' : '') + '" data-kerros="kivikko"' + (KV.length ? '' : ' disabled') + '>🪨 Kivikko (' + KVk * 10 + ' m' + (KVt ? ', taimen ' + KVt * 10 + ' m' : '') + ')</button>'
        + '<div class="huom">' + (L.pisteet.length || P.length || KI.length || KV.length ? 'Lämpö: sininen kylmin, punainen lämpimin. Keltainen = syöttikalaparvi kaikukuvasta, oranssi = laite luki parven pohjaksi. Punainen kaari = iso yksittäinen kaiku (haalea: pohjan tuntumassa, voi olla kivi). Neliö = kivikko sivukeilasta (oranssi kivikko, turkoosi kehä taimenkivikko 0–5 m; kaikki tallenteet). Napauta: aika, syvyys ja lajiepäily. Yli vuorokauden vanhat himmeinä.'
          : 'Ei tallenteita tältä järveltä 7 vrk:n ajalta. Tuo .sl2/.slg etusivun Oma luotaus -kortista.') + '</div>';
    }
    // v187: millä veneellä rajat lasketaan (sama valinta kuin etusivun aallonkorkeuskortissa)
    function veneValikko() {
      const v = window.akVeneRajat ? window.akVeneRajat() : null;
      if (!v) return '';
      return '<div class="huom" style="margin-top:4px;color:var(--text)">Vene: ' + String(v.vene).split(' · ')[0] + '</div>'
        + '<div class="huom">Kalastusraja ' + n2(v.raja) + ' m, ajoraja ' + n2(v.turva) + ' m. Vaihto etusivun aallonkorkeuskortista.'
        + (v.huom ? '<br><b style="color:#f5b700">' + v.huom + '</b>' : '') + '</div>';
    }
    function kytkeMerkit(v) {
      v.querySelectorAll('button[data-kerros]').forEach(b => { b.onclick = () => {   // v193: lämpöjälki ja parvet
        const k = b.dataset.kerros; as[k] = !as[k]; tallennaAs(); pyydaPiirto(); b.classList.toggle('valittu', as[k]);
      }; });
      v.querySelectorAll('button[data-kulku]').forEach(b => { b.onclick = () => {   // v193
        vaihdaKulku(); b.classList.toggle('valittu', as.kulku); b.textContent = '🧭 ' + (as.kulku ? 'Kulkusuunta ylös' : 'Pohjoinen ylös');
      }; });
      v.querySelectorAll('button[data-merkit]').forEach(b => { b.onclick = () => {
        const l = b.dataset.merkit; as[l] = !as[l]; tallennaAs(); pyydaPiirto();
        b.classList.toggle('valittu', as[l]);
      }; });
    }
    cv.addEventListener('pointerdown', () => { $('valikko').style.display = 'none'; });
    $('tuntiEd').onclick = () => vaihdaTunti(-1);
    $('tuntiSeur').onclick = () => vaihdaTunti(1);
    $('tuntiTeksti').onclick = () => { tuntiKasin = false; tunti = nykyTunti(); renderoi(false); };
    function vaihdaTunti(d) {
      const T = window.akTunnit ? window.akTunnit() : []; if (!T.length) return;
      tunti = Math.max(0, Math.min(T.length - 1, tunti + d)); tuntiKasin = tunti !== nykyTunti(); renderoi(false);
    }
    $('seuraava').onclick = () => { const s = kerros && kerros.seur; if (s && pohja) { asetaSeuraa(false); keskita(s.c.lat, s.c.lon); pyydaPiirto(); } };
    $('jarvi').onchange = function () { tuntiKasin = false; asetaSeuraa(false); valitseJarvi(this.value, true); };
    window.addEventListener('resize', () => { if (nak && seuraa && oma) keskitaVene(); pyydaPiirto(); });
    window.addEventListener('storage', e => {
      if (e.key === KLOONI_LS) { paivitaKerros(); pyydaPiirto(); }
      if (typeof LS_SAALIS === 'string' && e.key === LS_SAALIS) { paivitaSaaliit(); pyydaPiirto(); }   // v180: kirjaus toisessa välilehdessä
      if (typeof KIRJAUSPOHJA_LS === 'string' && e.key === KIRJAUSPOHJA_LS) { pohjaVali.t = 0; paivitaKalaNappi(); pyydaPiirto(); }   // v186: + kuha- ja taimenpaikat
      if (typeof LAHTOPAIKAT_LS === 'string' && e.key === LAHTOPAIKAT_LS) pyydaPiirto();   // v181
      // uusi oma luotaus tuotu pääsovelluksessa: syvyysruudukko lasketaan uudelleen sivun latauksessa
      if (e.key === 'uistelututka_omaluotaus') { tila('Oma luotaus päivittyi: ladataan kartta uudelleen…'); setTimeout(() => location.reload(), 800); }
    });
    /* ---------- v192: toistuva analyysi uistelun aikana ----------
       Kun uistelu on päällä (Aloita uistelu etusivulla), analyysi toistetaan kerran jokaisessa puolen tunnin jaksossa
       (:00 ja :30), tilanne 30 min eteenpäin. Täällä etusivu ladataan näkymättömään kehykseen (index.html?tausta=1), joka
       ajaa analyysin samoilla valinnoilla, tallentaa kirjauspohjan (merkit päivittyvät storage-tapahtumasta) ja palauttaa
       kuulutuksen, jos Vesillä-ruudun lajin paras paikka tai syysohjeen ranta vaihtui. Jakso on yhteinen etusivun kanssa
       (uistelututka_auto_analyysi), joten samaa jaksoa ei ajeta kahdesti. Kartta, GPS ja vaakalukko jatkuvat. */
    const AUTO_LS = 'uistelututka_auto_analyysi', AUTO_JAKSO_MS = 1800e3;
    let autoKehys = null, autoKehysAika = null;
    function autoLueT() { try { return JSON.parse(localStorage.getItem(AUTO_LS) || 'null'); } catch (e) { return null; } }
    function autoUisteluPaalla() { try { return !!pyyntiLue(LS_PYYNTI_AUKI, null); } catch (e) { return false; } }
    function autoTarvitaanT() {
      if (!autoUisteluPaalla()) return false;
      const r = autoLueT(), slot = Math.floor(Date.now() / AUTO_JAKSO_MS);
      if (!r || !(r.slot >= slot)) return true;
      return !!(r.kesken && Date.now() - (r.alkoi || 0) > 120000);
    }
    function autoTarkistaT() {
      if (document.hidden || autoKehys || !autoTarvitaanT()) return;
      const f = document.createElement('iframe');
      f.src = './index.html?tausta=1'; f.title = 'Analyysi taustalla'; f.setAttribute('aria-hidden', 'true'); f.tabIndex = -1;
      f.style.cssText = 'position:fixed;left:-20000px;top:0;width:412px;height:860px;border:0;opacity:0;pointer-events:none;';
      autoKehys = f; document.body.appendChild(f);
      autoKehysAika = setTimeout(() => autoValmisT(null), 120000);
    }
    function autoKloT(t) { const d = new Date(t); return d.getHours() + '.' + String(d.getMinutes()).padStart(2, '0'); }
    function autoPuhuT(teksti) {
      try { if (navigator.vibrate) navigator.vibrate(150); } catch (e) {}
      try {
        if (!('speechSynthesis' in window) || typeof SpeechSynthesisUtterance !== 'function') return;
        const aanet = speechSynthesis.getVoices() || [], aani = aanet.find(v => /^fi(-|_|$)/i.test(v.lang)) || null;
        String(teksti).split('¶').map(x => x.trim()).filter(Boolean).forEach(pala => {
          const u = new SpeechSynthesisUtterance(pala); if (aani) u.voice = aani; u.lang = 'fi-FI'; u.rate = 0.95; speechSynthesis.speak(u);
        });
      } catch (e) { console.warn('Puhe:', e.message); }
    }
    function autoValmisT(d) {
      clearTimeout(autoKehysAika); autoKehysAika = null;
      if (autoKehys) { try { autoKehys.remove(); } catch (e) {} autoKehys = null; }
      if (!d || !d.ok) {   // jakso kuitataan, ettei raskas lataus toistu kahden minuutin välein
        const r = autoLueT() || {}, slot = Math.floor(Date.now() / AUTO_JAKSO_MS);
        try { localStorage.setItem(AUTO_LS, JSON.stringify(Object.assign({}, r, { slot: Math.max(r.slot || 0, slot), kesken: false, virhe: 'tilannekuva: ei vastausta' }))); } catch (e) {}
        ilmoita('Analyysin päivitys ei onnistunut'); return;
      }
      pohjaVali.t = 0; try { paivitaKalaNappi(); } catch (e) {} pyydaPiirto();
      ilmoita('Analyysi päivitetty: tilanne klo ' + autoKloT(d.kohde));
      if (d.puhe) {
        nayttoTieto('<b>Analyysi klo ' + autoKloT(Date.now()) + ' (tilanne klo ' + autoKloT(d.kohde) + ')</b><br>' + String(d.puhe).split('¶').slice(1).map(x => x.trim()).join(' '));
        autoPuhuT(d.puhe);
      }
    }
    window.addEventListener('message', e => {
      if (e.origin !== location.origin || !e.data || e.data.tyyppi !== 'utAutoAnalyysi') return;
      if (!autoKehys || e.source !== autoKehys.contentWindow) return;
      autoValmisT(e.data);
    });
    setInterval(autoTarkistaT, 20000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) setTimeout(autoTarkistaT, 1500); });
    setTimeout(autoTarkistaT, 8000);
    window.utTilanneAuto = { tarkista: autoTarkistaT };   // testejä varten
    window.utTilanneKierto = { kierto: () => kierto, vaihda: v => vaihdaKulku(v), latLon: (x, y) => latLon(x, y), siirto: () => veneSiirto() };   // v193: testejä varten

    setInterval(() => {   // tunti vaihtuu: pohjakuva nykyhetkeen, ellei tuntia ole valittu käsin
      if (!tuntiKasin && pohja && pohja.ennuste && nykyTunti() !== tunti) { tunti = nykyTunti(); renderoi(false); }
      paivitaKerros(); pyydaPiirto();
    }, 60e3);

    /* ---------- käynnistys ---------- */
    function aloita() {
      $('klooniNappi').classList.toggle('paalla', as.kloonit); $('yoNappi').classList.toggle('paalla', as.yo);
      paivitaVaakaNappi();
      if (as.vaaka && !vaakaTila()) setTimeout(() => ilmoita('↻ Napauta näyttöä: vaakanäkymä palaa'), 1500);   // v182
      if (typeof rakennaSaalis !== 'function' || typeof syvyysJarvella !== 'function' || typeof KLOONI_SIVU !== 'object') { $('kalaNappi').style.display = 'none'; }   // puuttuva tiedosto näkyy virheruudussa
      else {
        let painettu = 0;   // tärähdys ei tee kahta kirjausta; kaksi kalaa yhtä aikaa = kaksi erillistä painallusta
        $('kalaNappi').onclick = () => { if (Math.abs(Date.now() - painettu) < 800) return; painettu = Date.now(); try { kalaKiinni(); } catch (e) { naytaKirjaus(null, {}, false); } };
        paivitaKalaNappi(); paivitaSaaliit();
        try { mmlIdbHae().then(() => paivitaLukemat()).catch(() => {}); } catch (e) {}   // MML-syvyydet puhelimen muistista (etusivu lataa ne)
      }
      if (typeof window.aaltokarttaAlusta !== 'function' || typeof window.UT_JARVET !== 'object') { tila(''); return; }   // virhe näkyy jo
      // järvi: sovelluksen valittu paikka (sama sääntö kuin mallissa: nimen alku); GPS vaihtaa tarvittaessa
      let paikka = ''; try { paikka = localStorage.getItem('uistelututka_valittu_paikka') || ''; } catch (e) {}
      const J = window.UT_JARVET;
      window.akAlkuJarvi = Object.keys(J).find(k => { const jn = J[k].nimi || ''; return paikka && (paikka.slice(0, 8) === jn.slice(0, 8) || jn.indexOf(paikka.split(' ')[0]) === 0); }) || null;
      /* Havaittu tuuli: pääsovellus tallentaa FMI-aseman havainnon (v179); malli korjaa ennusteen sillä samoin
         kuin aaltokortissa (vain ≤ 2 h vanha havainto). Käytetään vain, jos havainto on tämän järven paikalta. */
      window.akHavaittuTuuli = function () {
        try {
          const h = JSON.parse(localStorage.getItem('uistelututka_havaittu_tuuli') || 'null');
          if (!h || h.ws == null || !h.aika) return null;
          if (h.paikka && window.akAvainPaikalle && window.akAvainPaikalle(h.paikka) !== avain) return null;
          return { ws: h.ws, wg: h.wg, wd: h.wd, aika: new Date(h.aika), asema: h.asema };
        } catch (e) { return null; }
      };
      /* v181: pinkki kumpuamisalue. Malli kysyy window.kumpuArvio-funktiolta, onko kumpuaminen vahvaa; etusivulla se
         laskee lämpötiedoista. Tässä samat parametrit tulevat kirjauspohjasta (sama järvi, enintään 12 h vanha) ja
         lasketaan samalla funktiolla (kirjaus.js: kumpuArvioParam). Ilman pohjaa pinkkiä ei piirretä (ei arvata). */
      const kumpuPohja = () => {
        const P = (typeof pohjaRajauksiin === 'function') ? pohjaRajauksiin() : null;
        return (P && P.kumpu && P.avain === avain && Date.now() - Date.parse(P.aika) <= KIRJAUSPOHJA_MAX_MS) ? P.kumpu : null;
      };
      if (typeof kumpuArvioParam === 'function') {
        window.kumpuArvio = (U, L, tunteja) => { const k = kumpuPohja(); return k && k.p ? kumpuArvioParam(k.p, U, L, tunteja) : null; };
        window.kumpuHistoriaTunteja = dir => { const k = kumpuPohja(); return k ? kumpuHistoriaParam(k.kertyma, dir) : 0; };
      }
      try { window.aaltokarttaAlusta(); } catch (e) { tila('Mallin käynnistys epäonnistui: ' + (e && e.message || e)); return; }
      const sel = $('jarvi');
      window.akJarviAvaimet().forEach(k => { const o = document.createElement('option'); o.value = k; o.textContent = J[k].nimi; sel.appendChild(o); });
      avain = window.akAlkuJarvi && J[window.akAlkuJarvi] ? window.akAlkuJarvi : sel.options[0] && sel.options[0].value;
      valitseJarvi(avain, true);
      kaynnistaGps(); pidaNayttoPaalla();
      try { if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}
    }
    window.utTilanne = { piirra: pyydaPiirto, tila: () => ({ avain, tunti, tuntiKasin, seuraa, oma, nak, pohja: pohja && { avain: pohja.avain, naytto: pohja.naytto, ennuste: pohja.ennuste, w: pohja.kuva.width, h: pohja.kuva.height }, kerros: kerros && { avain: kerros.avain, seuraava: kerros.seuraava } }), napautus, sijainti,
                       kalaKiinni, kirjattu: () => kirjattu, saaliit: () => saaliit.length, vana: () => utVana.pisteet().slice(),
                       naytolle: (la, lo) => naytolle(la, lo), paikat: l => paikkaKartta(l), lohi: () => lohiKaistat(), keskita: (la, lo, m) => { asetaSeuraa(false); keskita(la, lo, m); pyydaPiirto(); } };   // testejä varten (v186: naytolle, paikat, keskita)
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', aloita); else aloita();
  })();
  </script>
