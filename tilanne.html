<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#060B14">
  <title>Tilannekuva — Uistelututka</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
  <!--
  ===== TILANNEKUVA (tilanne.html) — 10.10.2026 (v179) =====
  Hannu 10.10.2026: tilannetietoisuudelle oma kevyt sivu, jotta pääsovellus ei kasva rajatta ja
  vesillä näkyy vain se, mitä siellä tarvitaan: kartta, oma sijainti ja kulkusuunta, aallokko
  (veneen kalastusraja), kloonipisteet ja seuraava kohde, ottipaikat. "Pyritään erinomaisuuteen ja laatuun."
  PERIAATTEET
    - Sama malli, ei kopiota: aalto, virtaus ja syvyys tulevat aaltomalli.js:stä (akRenderoi piirtää
      pohjakuvan samalla piirra()-funktiolla kuin aaltokortti), kloonit kloonit.js:stä, paikat paikat.js:stä.
    - Sama osoite kuin index.html, joten tallennukset ovat yhteiset (kloonit, vene ja kalastusraja,
      valittu paikka). Muutokset toisesta välilehdestä päivittyvät tänne (storage-tapahtuma).
    - Kartta piirretään tässä: pohjakuva kerran tunnissa/tilan vaihtuessa, päälle oma sijainti ja merkit
      vektoreina näytön tarkkuudella. Siirto ja zoomaus eivät laske mallia uudelleen.
    - Paikannus käynnistyy sivun auetessa ja näyttö pidetään päällä (Wake Lock). Selain keskeyttää
      paikannuksen, kun näyttö sammuu tai sivu on taustalla; sitä ei web-sovelluksessa voi kiertää.
  v180 (10.10.2026): KALA KIINNI tällä sivulla, täysi kirjaus (Hannu: "jatketaan" v179-suunnitelman mukaan).
    - Yksi napautus tallentaa heti saman rivin kuin etusivun Kala kiinni: rivi rakennetaan samalla funktiolla
      (kirjaus.js: rakennaSaalis). Etusivun tila (sää, vesi, kyselyn vastaukset, ennusteet, suositukset,
      harppaus- ja lämpötieto) tulee kirjauspohjasta, jonka etusivu tallentaa jäädessään taustalle; aika, GPS,
      nopeus, veneen kohdan pohja (syvyys.js) ja mallin arviot lasketaan tässä kirjaushetkellä.
    - Laji on viimeksi valittu (napissa näkyy). Kirjauksen jälkeen lajin voi vaihtaa yhdellä napautuksella ja
      kirjauksen poistaa (kaksi napautusta). Pituus ja syvyys täydennetään etusivun saalislistasta (✏️ Täydennä).
    - Kloonit samalla koodilla kuin etusivulla (kloonit.js): osuma aiempaan klooniin ja uudet kloonit.
    - Rivillä lisäksi kirjausLahde 'tilanne', kirjauspohjaAika ja gpsIkaS, jotta lähde ja tuoreus näkyvät.
    - Syvyyslukema sama kuin etusivulla (MML + oma luotaus, syvyys.js), päivän saaliit kartalla, ja avoimeen
      uistelureissuun (etusivun Aloita uistelu) kirjautuu GPS-piste kerran minuutissa myös tällä sivulla.
  v181 (10.10.2026): Hannu "haluan nyt kaikki": kaikki aaltokortin tilat (aalto, murtuva, pintavirta, syvempi vesi,
    vajoama, kumpuama, konvergenssi, syvyys) valikosta, väriselite kartan reunassa, napautus kertoo kohdan arvon
    samalla tekstillä kuin aaltokortti (akPisteTeksti), pinkki kumpuamisalue etusivun lämpötiedoista (kirjauspohja),
    ja lähtöpaikka päivän suunnitelmalle (napautus → ⚓, näkyy ankkurina).
  v182 (10.10.2026): VAAKA-ASETTELU. Hannu 10.10.: puhelin on telineessä vaakana, koska latausjohto asettuu niin
    paremmin; KALA oikeaan reunaan.
    - ↻-nappi: koko näyttö ja vaakalukko (screen.orientation.lock('landscape')). Standardin mukaan lukko toimii vain koko
      näytön tilassa, ja koko näyttö vaatii napautuksen. Lukko sallii molemmat vaaka-asennot anturin mukaan, joten
      johto voi olla kummalla puolella tahansa. Valinta muistetaan: kun sivu avataan uudelleen, ensimmäinen napautus
      palauttaa vaakanäkymän. Etusivu pysyy pystyssä (manifest.json ennallaan).
    - Vaakanäkymässä (leveämpi kuin korkea ja korkeus enintään 600 px) kartta saa koko korkeuden. Oikeassa reunassa on
      sarake: nopeus ja kurssi isolla, syvyys ja aalto, napit ja KALA alimpana. Järvi, tunti ja karttatila ovat pieninä
      kartan vasemmassa yläkulmassa. Kala kiinni -vahvistus, napautustieto ja tilavalikko aukeavat vasemmalle, eivät
      veneen päälle.
    - Pystynäkymä ennallaan (↻-nappi lisätty).
  v183 (10.10.2026): OMA VENE JA VANA. Hannu lähetti Beason 630 WA -kuvan: "paikan ilmaista tälläisellä iconilla joka näyttää
    suunnan minne menossa, 50 m häntä olisi plussaa mistä tullut, pituus ei niin tarkka hahmottamiseen riittävä."
    - Vihreän nuolen tilalla vene ylhäältä: valkoinen runko, tumma ohjaamo, perämoottori, syaani hehku ja tumma reunaviiva
      (erottuu kaikilla karttaväreillä). Piirretään vektorina, ei kuvatiedostoa. Keula GPS-kulkusuuntaan. Koko 44 px näytöllä.
    - Vana = oikea GPS-reitti veneen takana: vähintään 50 m ja aina vähintään 80 px, koska oletusnäkymässä (3 km leveys)
      50 m on alle 10 px ja jäisi veneen kuvan alle. Häipyy päätä kohti.
    - Paikallaan GPS-kohina ei piirrä kiemuraa: GPS:n oma nopeus alle 1 km/h ei lisää pisteitä eikä käännä venettä; uusi
      piste 5–15 m siirtymästä tarkkuuden mukaan (ilman GPS-nopeutta 10–20 m). Yli 40 m:n tarkkuus ei piirrä. Yli 3 min
      katko tai yli 100 km/h hyppy (GPS-virhe) aloittaa vanan alusta.
    - Vana on vain tämän välilehden muistissa (sessionStorage, enintään 45 min / 2 km), ei saalislokissa.
    - Vihreä ennusteviiva (5 min nykyisellä nopeudella, vähintään 30 px keulan edessä) vain, kun suunta on mitattu
      viimeisen minuutin aikana. Jos vene on seissyt, se näkyy haaleana viimeisimpään kulkusuuntaan. Ennen ensimmäistä
      liikettä merkki on pyöreä.
  v184 (10.10.2026): ALAPALKKI NÄKYVIIN. Hannun kuvakaappaus (S25 Ultra, ei osoiteriviä, kolmen napin navigointi):
    alapalkki (nopeus, syvyys, ◎ 🎯 ☾ ↻) jäi kokonaan Androidin navigointipalkin alle, joten ↻-nappia ei näkynyt.
    Syy: viewport-fit=cover. Sen kanssa Chrome (135→) ulottaa sivun ruudun alareunaan navigointipalkin alle, mutta
    env(safe-area-inset-bottom) oli kuvan mittojen mukaan 0, joten palkki ei noussut. viewport-fit=cover poistettu (kuten
    index.html:ssä, joka näkyy oikein): selain pitää sivun järjestelmäpalkkien välissä. env()-arvot jäävät koodiin
    (ilman coveria ne ovat 0). Vaakanäkymän koko näytössä kameran reikä jää nyt sivun ulkopuolelle (selain rajaa).
  v185 (10.10.2026): VENE JA VANA YHTEISEEN TIEDOSTOON (vene.js). Hannu valitsi "vene etusivun kartoille": aaltokortti ja
    syvyyskartta piirtävät nyt saman veneen ja vanan kuin tämä sivu. Koodi siirretty sanasta sanaan; tämän sivun kuva on
    bitilleen sama kuin v184:ssä (testattu). Vana on välilehden yhteinen (sessionStorage 'ut_vana', v183:n
    'tilanne_vana' luetaan kerran), joten etusivulla kuljettu reitti jatkuu tilannekuvassa ja päinvastoin.
  v187 (10.10.2026): VENELISTA (aaltomalli.js). Valikon alaosassa näkyy, millä veneellä rajat lasketaan, ja huomautus,
    jos tallennettua venettä ei tunnistettu.
  v186 (10.10.2026): KUHA- JA TAIMENPAIKAT. Hannu valitsi "Ehdokkaat tilannekuvaan". Etusivun Analysoi tallentaa aaltokortin
    kuha- ja taimenmerkit perusteluineen kirjauspohjaan (P.kartta); täällä samat merkit ja napautuksesta perustelut
    todisteen tasoineen. Kytkimet tilavalikossa. Samassa kohdassa olevat merkit (esim. kuhapaikka ja ottipaikka)
    näkyvät napautuksessa yhdessä.
  -->
  <style>
    :root { --bg:#060B14; --panel:#0E1B2E; --panel-alt:#13253D; --line:#1E3350; --text:#E7EEF6; --muted:#7E93AC;
            --amber:#FFB020; --cyan:#45D3E8; --vihrea:#7ED957; --violetti:#b794ff; --kulta:#f5b700; --puna:#FF453A; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
                 font-family: 'Barlow Condensed', system-ui, sans-serif; overscroll-behavior: none; }
    body { display: flex; flex-direction: column; height: 100dvh; }
    button, select { font: inherit; color: inherit; }
    #yla { flex: 0 0 auto; display: flex; gap: 6px; align-items: center; padding: calc(6px + env(safe-area-inset-top)) 8px 6px;
           background: var(--panel); border-bottom: 1px solid var(--line); }
    .nappi { min-width: 44px; height: 44px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--line);
             background: var(--panel-alt); font-size: 17px; font-weight: 700; letter-spacing: .02em; display: inline-flex;
             align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: var(--text); cursor: pointer; }
    .nappi.paalla { border-color: var(--vihrea); color: var(--vihrea); }
    #jarvi { height: 44px; min-width: 0; flex: 1 1 auto; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-alt);
             padding: 0 8px; font-size: 17px; font-weight: 600; }
    #tunti { display: flex; align-items: center; gap: 2px; }
    #tuntiTeksti { min-width: 74px; text-align: center; font-size: 15px; line-height: 1.05; cursor: pointer; }
    #tuntiTeksti small { display: block; color: var(--muted); font-size: 12px; }
    #alue { position: relative; flex: 1 1 auto; min-height: 0; }
    #kartta { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; background: #0a1626; }
    #seuraava { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); max-width: calc(100% - 16px);
                background: rgba(4,10,18,.88); border: 1.5px solid var(--kulta); color: var(--kulta); border-radius: 10px;
                padding: 6px 12px; font-size: 19px; font-weight: 700; white-space: nowrap; display: none; cursor: pointer; }
    #tila { position: absolute; left: 8px; bottom: 8px; background: rgba(4,10,18,.8); color: var(--muted); border-radius: 8px;
            padding: 4px 8px; font-size: 13px; max-width: calc(100% - 110px); }
    #tieto { position: absolute; left: 8px; right: 8px; bottom: 8px; background: rgba(14,27,46,.97); border: 1px solid var(--line);
             border-radius: 12px; padding: 10px 40px 10px 12px; font-size: 15px; line-height: 1.35; display: none; max-height: 45%; overflow: auto; }
    #tieto b { color: var(--text); }
    #tieto .syy { margin-top: 5px; }   /* v186: kuha- ja taimenpaikan perustelut */
    #tieto .taso { display: inline-block; padding: 0 6px; margin-right: 5px; border: 1px solid var(--line); border-radius: 9px; font-size: 12px; color: var(--cyan); }
    #valikko button.merkki { font-size: 15px; }
    #tietoSulje { position: absolute; right: 4px; top: 4px; width: 36px; height: 36px; border: 0; background: transparent; color: var(--muted); font-size: 20px; }
    #ilmoitus { position: absolute; left: 50%; top: 56px; transform: translateX(-50%); background: var(--vihrea); color: #04121f;
                border-radius: 10px; padding: 8px 14px; font-size: 18px; font-weight: 700; display: none; white-space: nowrap; }
    #ala { flex: 0 0 auto; display: flex; gap: 8px; align-items: center; padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
           background: var(--panel); border-top: 1px solid var(--line); }
    #lukemat { flex: 1 1 auto; min-width: 0; line-height: 1.05; }
    #nopeus { font-size: 30px; font-weight: 700; color: var(--vihrea); }
    #nopeus small, #kurssi small { font-size: 14px; color: var(--muted); font-weight: 600; }
    #kurssi { font-size: 22px; font-weight: 700; margin-left: 6px; }
    #lisarivi { font-size: 13px; color: var(--muted); line-height: 1.2; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    #virhe { display: none; position: absolute; inset: 0; padding: 24px; background: var(--bg); color: var(--text); font-size: 18px; line-height: 1.4; }
    /* v180: Kala kiinni. Iso nappi oikeassa alakulmassa (peukalo), ei kartan päällä olevien paneelien alla. */
    #kalaNappi { position: absolute; right: 10px; bottom: 54px; width: 76px; height: 76px; border-radius: 18px; border: 2px solid #fff3;
                 background: #D7263D; color: #fff; font-weight: 700; line-height: 1; display: flex; flex-direction: column; align-items: center;
                 justify-content: center; gap: 3px; box-shadow: 0 3px 12px rgba(0,0,0,.55); z-index: 5; cursor: pointer; }
    #kalaNappi:active { transform: scale(.96); }
    #kalaNappi .iso { font-size: 25px; }
    #kalaNappi .pieni { font-size: 15px; letter-spacing: .02em; }
    #kalaNappi #kalaLaji { font-size: 13px; font-weight: 600; opacity: .9; }
    #tieto { right: 94px; }
    #kirjaus { position: absolute; left: 8px; right: 94px; bottom: 8px; background: rgba(14,27,46,.98); border: 1.5px solid var(--vihrea);
               border-radius: 12px; padding: 9px 10px; font-size: 15px; line-height: 1.35; display: none; z-index: 4; max-height: 70%; overflow: auto; }
    #kirjaus .otsikko { font-size: 19px; font-weight: 700; color: var(--vihrea); }
    #kirjaus .hint { color: var(--muted); font-size: 13px; }
    #kirjaus .lajit { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 6px; }
    #kirjaus .laji { min-height: 40px; padding: 0 11px; border-radius: 20px; border: 1px solid var(--line); background: var(--panel-alt);
                     font-size: 16px; font-weight: 600; }
    #kirjaus .laji.valittu { border-color: var(--vihrea); color: #04121f; background: var(--vihrea); }
    #kirjaus .rivi { display: flex; gap: 8px; margin-top: 8px; }
    #kirjaus .rivi button { flex: 1 1 0; min-height: 42px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-alt); font-size: 16px; font-weight: 700; }
    #kirjaus .rivi .poista { color: #ff8a80; border-color: #5b2a2a; }
    #kirjaus.virhe { border-color: var(--puna); }
    /* v181: tilavalikko ja väriselite */
    #valikko { position: absolute; right: 8px; top: 8px; z-index: 7; background: rgba(14,27,46,.98); border: 1px solid var(--line);
               border-radius: 12px; padding: 6px; display: none; grid-template-columns: 1fr 1fr; gap: 6px; width: min(300px, calc(100% - 16px)); }
    #valikko button { min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-alt); font-size: 17px; font-weight: 700; }
    #valikko button.valittu { border-color: var(--vihrea); color: var(--vihrea); }
    #valikko button:disabled { opacity: .35; }
    #valikko .huom { grid-column: 1 / -1; color: var(--muted); font-size: 13px; padding: 2px 4px; }
    #selite { position: absolute; left: 6px; top: 52px; z-index: 3; background: rgba(4,10,18,.78); border-radius: 8px; padding: 4px; display: none;
              font-size: 11px; color: var(--muted); max-width: calc(100% - 110px); cursor: pointer; }
    #selite .nimi { font-weight: 700; color: var(--text); font-size: 12px; margin: 0 1px 3px; }
    #seliteVarit { display: flex; flex-direction: column-reverse; border-radius: 3px; overflow: hidden; width: max-content; }
    #seliteVarit div { min-width: 34px; padding: 0 4px; height: 16px; line-height: 16px; font-size: 10px; text-align: center; color: #fff;
                       text-shadow: 0 0 2px rgba(0,0,0,.6); white-space: nowrap; }
    #seliteYks { display: none; margin-top: 4px; max-width: 220px; line-height: 1.3; }
    #selite.auki #seliteYks { display: block; }
    /* v182: nappiryhmä (pystyssä rivi, vaakana 2 × 2) */
    #napit { display: flex; gap: 8px; flex: 0 0 auto; }
    /* v182: VAAKANÄKYMÄ puhelimessa (telineessä). Kartta koko korkeudelle, sarake oikealle, KALA sarakkeen alaosaan. */
    @media (orientation: landscape) and (max-height: 600px) {
      :root { --sarake: 176px; }
      body { flex-direction: row; }
      #yla { position: fixed; z-index: 6; top: calc(6px + env(safe-area-inset-top)); left: calc(6px + env(safe-area-inset-left));
             max-width: calc(100vw - var(--sarake) - 24px); padding: 4px; gap: 4px; border: 1px solid var(--line); border-radius: 12px;
             background: rgba(14,27,46,.92); }
      #yla .nappi { min-width: 38px; height: 38px; padding: 0 8px; font-size: 15px; }
      #jarvi { height: 38px; font-size: 15px; flex: 0 1 150px; }
      #tuntiTeksti { min-width: 62px; font-size: 13px; }
      #tuntiTeksti small { font-size: 11px; }
      #alue { flex: 1 1 auto; min-width: 0; }
      #ala { flex: 0 0 var(--sarake); flex-direction: column; align-items: stretch; justify-content: flex-start; gap: 10px; overflow: hidden;
             padding: calc(8px + env(safe-area-inset-top)) calc(8px + env(safe-area-inset-right)) calc(102px + env(safe-area-inset-bottom)) 8px;
             border-top: 0; border-left: 1px solid var(--line); }
      #lukemat { flex: 1 1 auto; min-height: 0; overflow: hidden; }
      #nopeus { display: block; font-size: 42px; line-height: 1; }
      #kurssi { display: block; font-size: 30px; margin: 2px 0 6px; }
      #lisarivi { font-size: 15px; line-height: 1.3; -webkit-line-clamp: 7; }
      #napit { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      #napit .nappi { width: 100%; }
      #kalaNappi { position: fixed; right: calc(10px + env(safe-area-inset-right)); bottom: calc(10px + env(safe-area-inset-bottom));
                   width: calc(var(--sarake) - 20px); height: 84px; gap: 2px; }
      #kalaNappi .iso { font-size: 26px; }
      #kalaNappi .pieni { font-size: 21px; }
      #kalaNappi #kalaLaji { font-size: 15px; }
      #seuraava { top: 56px; }
      #selite { top: 56px; }
      #ilmoitus { top: 104px; }
      #valikko { left: 8px; right: auto; top: 56px; }
      #kirjaus, #tieto { left: 8px; right: auto; top: 56px; bottom: 8px; width: min(48%, 400px); max-height: none; }
      #tila { max-width: calc(100% - 16px); }
    }
    #tieto .ankkuri { margin-top: 6px; min-height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-alt); font-size: 15px; font-weight: 700; }
    #kirjaus.virhe .otsikko { color: var(--puna); }
  </style>
</head>
<body>
  <div id="yla">
    <a class="nappi" href="./index.html" title="Takaisin uistelututkaan" aria-label="Takaisin uistelututkaan">⇦</a>
    <select id="jarvi" aria-label="Järvi"></select>
    <div id="tunti">
      <button class="nappi" id="tuntiEd" aria-label="Edellinen tunti">◀</button>
      <div id="tuntiTeksti" title="Napauta: takaisin nykyhetkeen">–<small>&nbsp;</small></div>
      <button class="nappi" id="tuntiSeur" aria-label="Seuraava tunti">▶</button>
    </div>
    <button class="nappi" id="tilaNappi" aria-label="Kartan suure">Aalto</button>
  </div>

  <div id="alue">
    <canvas id="kartta"></canvas>
    <div id="seuraava" title="Napauta: näytä kohde"></div>
    <div id="ilmoitus"></div>
    <div id="tila">Käynnistetään…</div>
    <div id="tieto"><button id="tietoSulje" aria-label="Sulje">✕</button><div id="tietoSisalto"></div></div>
    <div id="kirjaus" aria-live="polite"></div>
    <div id="selite" title="Napauta: selitys"><div class="nimi" id="seliteNimi"></div><div id="seliteVarit"></div><div id="seliteYks"></div></div>
    <div id="valikko" role="menu"></div>
    <button id="kalaNappi" aria-label="Kala kiinni: kirjaa saalis"><span class="iso">🐟</span><span class="pieni">KALA</span><span id="kalaLaji">taimen</span></button>
    <div id="virhe"></div>
  </div>

  <div id="ala">
    <div id="lukemat">
      <div><span id="nopeus">–<small> km/h</small></span><span id="kurssi">–<small>°</small></span></div>
      <div id="lisarivi">Odotetaan sijaintia…</div>
    </div>
    <div id="napit">
      <button class="nappi paalla" id="minaNappi" aria-label="Keskitä omaan sijaintiin ja seuraa">◎</button>
      <button class="nappi paalla" id="klooniNappi" aria-label="Kloonit näkyviin">🎯</button>
      <button class="nappi" id="yoNappi" aria-label="Himmennä kartta">☾</button>
      <button class="nappi" id="vaakaNappi" aria-label="Vaakanäkymä: koko näyttö ja vaaka-asento">↻</button>
    </div>
  </div>

  <script>
    /* Puuttuva osa näkyy selvästi (sama periaate kuin index.html:ssä, v178). */
    var utPuuttuvat = [];
    function utOsaPuuttuu(nimi) {
      utPuuttuvat.push(nimi);
      function nayta() {
        var el = document.getElementById('virhe');
        el.style.display = 'block';
        el.innerHTML = '<b style="color:#FF453A">⚠ Osa tilannekuvasta ei latautunut: ' + utPuuttuvat.join(', ') + '.</b><br><br>'
          + 'Avaa uistelututka kerran verkossa, niin tiedostot tallentuvat puhelimeen. <a href="./index.html" style="color:#45D3E8">Takaisin uistelututkaan</a>';
      }
      if (document.readyState !== 'loading') nayta(); else document.addEventListener('DOMContentLoaded', nayta);
    }
  </script>

  <script src="luotaus.js?v=187" onerror="utOsaPuuttuu('luotaus.js')"></script>

  <script src="aaltomalli.js?v=187" onerror="utOsaPuuttuu('aaltomalli.js')"></script>
  <script src="kloonit.js?v=187" onerror="utOsaPuuttuu('kloonit.js')"></script>
  <script>
  (function () {
    'use strict';
    const APP_VERSIO = 'v187';
    window.APP_VERSIO = APP_VERSIO;   // kloonit.js merkitsee iskuun laskeneen version
    const $ = id => document.getElementById(id);
    const AS_LS = 'tilanne_asetukset';
    // v181: kaikki aaltokortin tilat samassa järjestyksessä kuin siellä; [tila, napin teksti, valikon teksti]
    const TILAT = [['aalto', 'Aalto', 'Aalto'], ['murtuva', 'Murtuva', 'Murtuva aallokko'], ['virtaus', 'Virta', 'Pintavirtaus'], ['syva', 'Syvä', 'Syvempi vesi'],
                   ['vajoama', 'Vajoama', 'Vajoama'], ['kumpuama', 'Kumpuama', 'Kumpuama'], ['konvergenssi', 'Konverg.', 'Konvergenssi'], ['syvyys', 'Syvyys', 'Syvyyskartta']];
    const PV = ['su', 'ma', 'ti', 'ke', 'to', 'pe', 'la'];
    const n1 = x => (Math.round(x * 10) / 10).toFixed(1).replace('.', ',');
    const n2 = x => (Math.round(x * 100) / 100).toFixed(2).replace('.', ',');
    const kk = n => String(n).padStart(2, '0');
    const ilmansuunta = deg => ['P', 'KO', 'I', 'KA', 'E', 'LO', 'L', 'LU'][Math.round((((deg % 360) + 360) % 360) / 45) % 8];   // mistä tuulee

    let as = { tila: 'aalto', kloonit: true, yo: false, laji: null, selite: false, vaaka: false, kuha: true, taimen: true };   // v186: kuha, taimen
    try { as = Object.assign(as, JSON.parse(localStorage.getItem(AS_LS) || '{}')); } catch (e) {}
    const tallennaAs = () => { try { localStorage.setItem(AS_LS, JSON.stringify(as)); } catch (e) {} };

    const cv = $('kartta'), ctx = cv.getContext('2d');
    let pohja = null;            // akRenderoi-tulos
    let nak = null;              // { s, x0, y0 }: näytön px = pohjan px · s + siirto
    let avain = null, tunti = 0, tuntiKasin = false, seuraa = true;
    let oma = null;              // { lat, lon, suunta, tarkkuus, kmh, aika }
    let kerros = null;           // klooniKerros
    let piirtoPyynto = false;

    function tila(t) { $('tila').textContent = t; $('tila').style.display = t ? '' : 'none'; }
    function ilmoita(t) {
      const el = $('ilmoitus'); el.textContent = t; el.style.display = 'block';
      clearTimeout(ilmoita.aj); ilmoita.aj = setTimeout(() => { el.style.display = 'none'; }, 6000);
    }

    /* ---------- koordinaatit: lat/lon ↔ pohjakuvan pikseli ↔ näyttö ---------- */
    function pohjaPx(lat, lon) {
      const k = pohja.k, w = pohja.win, S = pohja.S;
      return { x: ((lon - k.lansiLon) * 111320 * Math.cos(lat * Math.PI / 180) / k.ruutu - w.i0) * S,
               y: ((k.pohjoisLat - lat) * 111320 / k.ruutu - w.j0) * S };
    }
    function naytolle(lat, lon) { const p = pohjaPx(lat, lon); return { x: p.x * nak.s + nak.x0, y: p.y * nak.s + nak.y0 }; }
    function latLon(sx, sy) {
      const k = pohja.k, w = pohja.win, S = pohja.S;
      const bx = (sx - nak.x0) / nak.s, by = (sy - nak.y0) / nak.s;
      const lat = k.pohjoisLat - (by / S + w.j0) * k.ruutu / 111320;
      return { lat, lon: k.lansiLon + (bx / S + w.i0) * k.ruutu / (111320 * Math.cos(lat * Math.PI / 180)) };
    }
    const mPerPx = () => pohja.k.ruutu / pohja.S / nak.s;   // metriä näytön pikselillä

    function sovitaJarvi() {
      const w = cv.clientWidth, h = cv.clientHeight, W = pohja.kuva.width, H = pohja.kuva.height;
      const s = Math.min(w / W, h / H) * 0.96;
      nak = { s, x0: (w - W * s) / 2, y0: (h - H * s) / 2 };
    }
    function keskita(lat, lon, leveysM) {
      const w = cv.clientWidth, h = cv.clientHeight;
      if (leveysM) nak.s = w * pohja.k.ruutu / (leveysM * pohja.S);
      const p = pohjaPx(lat, lon);
      nak.x0 = w / 2 - p.x * nak.s; nak.y0 = h / 2 - p.y * nak.s;
    }

    /* ---------- piirto ---------- */
    function pyydaPiirto() { if (piirtoPyynto) return; piirtoPyynto = true; requestAnimationFrame(() => { piirtoPyynto = false; piirra(); }); }
    function koko() {
      const dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
      if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      return { w, h };
    }
    function teksti(t, x, y, vari, koko, tausta) {
      ctx.font = '700 ' + (koko || 14) + 'px "Barlow Condensed", system-ui, sans-serif';
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.lineWidth = 3.5; ctx.strokeStyle = tausta || 'rgba(4,10,18,.85)'; ctx.strokeText(t, x, y);
      ctx.fillStyle = vari; ctx.fillText(t, x, y);
    }
    function salmiakki(x, y, r) { ctx.beginPath(); ctx.moveTo(x, y - r); ctx.lineTo(x + r, y); ctx.lineTo(x, y + r); ctx.lineTo(x - r, y); ctx.closePath(); }
    function pyorea(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

    /* ---------- v183: oma vene ja vana ----------
       v185: vana (GPS-pisteet, säännöt, välilehden muisti) ja piirto siirretty sanasta sanaan tiedostoon vene.js, jotta
       etusivun aaltokortti ja syvyyskartta piirtävät saman veneen. Tämä sivu antaa vain oman koordinaatistonsa:
       utPiirraVana(ctx, { oma, naytolle, mPerPx }) ja utPiirraVeneMerkki(ctx, { oma, p, mPerPx, yo }). */

    /* ---------- v186: kuha- ja taimenpaikat tilannekuvaan ----------
       Hannu 10.10. (valinta listalta): "Ehdokkaat tilannekuvaan". Etusivun Analysoi laskee kuhapaikat (nimetyt ja ehdokkaat
       syvyyskartasta) ja taimenpaikat (harppauskerroksen mallista) ja tallentaa ne perusteluineen kirjauspohjaan
       (P.kartta.kuha / .taimen, sama sisältö kuin aaltokortin merkeillä). Täällä ne piirretään samoin merkein, ja napautus
       kertoo nimen, lyhyen tekstin, perustelut todisteen tasoineen ja lähimmän nimetyn paikan.
       - Vain sama järvi. Paikat koskevat analyysin hetkeä (voi olla tuleva, esim. illalla aamuksi tehty suunnitelma);
         ne eivät vaihdu kartan tunnin mukana, kuten aaltokortissakaan. Yli 12 h menneisyydessä oleva hetki ei näy.
       - Valikossa (tilanappi) kytkimet 🐟 ja 🎣; oletus päällä. */
    const PAIKKALAJIT = ['kuha', 'taimen'], PAIKAT_MAX_MS = 12 * 3600e3;
    const hetkiTeksti = ms => { const d = new Date(ms); return PV[d.getDay()] + ' ' + d.getDate() + '.' + (d.getMonth() + 1) + '. klo ' + klooniKello(ms); };
    const jarvenNimi = a => (window.UT_JARVET && window.UT_JARVET[a] && window.UT_JARVET[a].nimi) || a || '–';
    function paikkaKartta(laji) {   // → { K: { avain, hetki, kohteet, syy } tai null, syy }
      const P = pohjaRajauksiin(), K = P && P.kartta ? P.kartta[laji] : null;
      if (!K || !Array.isArray(K.kohteet)) return { K: null, syy: 'ei laskettu: paina etusivulla Analysoi' };
      if (K.avain !== avain) return { K: null, syy: 'laskettu järvelle ' + jarvenNimi(K.avain) };
      if (Date.now() - K.hetki > PAIKAT_MAX_MS) return { K: null, syy: 'laskettu hetkelle ' + hetkiTeksti(K.hetki) + ', yli 12 h sitten' };
      if (!K.kohteet.length) return { K: null, syy: 'ei paikkoja' + (K.syy ? ', koska ' + K.syy : '') + ' (' + hetkiTeksti(K.hetki) + ')' };
      return { K, syy: '' };
    }
    function paikkaMerkki(laji, q, x, y) {   // aaltokortin merkit (akPiirraKuhaMerkit / akPiirraTaimenMerkit), kerroin 1
      const oma = q.tyyppi === 'oma', vt = q.tyyppi === 'vaihtoehto';
      const r = oma ? (q.paras ? 9 : 7.5) : (laji === 'kuha' ? 8 : 9.5);
      ctx.beginPath(); ctx.arc(x, y, r + 2.2, 0, 6.2832); ctx.fillStyle = 'rgba(255,255,255,.92)'; ctx.fill();
      ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832);
      ctx.fillStyle = laji === 'kuha' ? (oma ? '#f2a024' : '#ffffff') : (oma ? '#3d8fd6' : vt ? '#dbe9f7' : '#ffffff'); ctx.fill();
      if (vt) ctx.setLineDash([4, 4]);
      ctx.lineWidth = oma ? 1.6 : 2.6; ctx.strokeStyle = laji === 'kuha' ? (oma ? '#3b2700' : '#c27400') : (oma ? '#0b2f52' : '#1c6fb8'); ctx.stroke();
      if (vt) ctx.setLineDash([]);
      if (q.tunnus) {
        ctx.font = '700 ' + (laji === 'kuha' ? 11 : (q.tunnus.length >= 3 ? 8.5 : 10)) + 'px system-ui, sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = laji === 'kuha' ? '#1d1400' : '#0b2f52';
        ctx.fillText(q.tunnus, x, y + 0.5); ctx.textAlign = 'left';
      }
    }
    function paikkaTietoHtml(laji, K, q) {
      const syyt = (q.syyt || []).map(s => '<div class="syy"><span class="taso">' + s.taso + '</span>' + s.teksti + (s.p ? ' <span style="color:#7E93AC">(' + (s.p > 0 ? '+' : '') + s.p + ')</span>' : '') + '</div>').join('');
      return '<b style="color:' + (laji === 'kuha' ? '#ffc46b' : '#8fc4ff') + '">' + (laji === 'kuha' ? '🐟 ' : '🎣 ') + q.nimi + '</b>'
        + ' <span style="color:#7E93AC">(etusivun analyysi, ' + hetkiTeksti(K.hetki) + ')</span><br>' + q.teksti + syyt
        + (q.lahin ? '<div class="syy" style="color:#7E93AC">' + q.lahin + '</div>' : '');
    }

    function piirra() {
      const { w, h } = koko();
      ctx.fillStyle = '#0a1626'; ctx.fillRect(0, 0, w, h);
      if (!pohja || !nak) return;
      ctx.imageSmoothingEnabled = true;
      ctx.drawImage(pohja.kuva, nak.x0, nak.y0, pohja.kuva.width * nak.s, pohja.kuva.height * nak.s);
      if (as.yo) { ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(0, 0, w, h); }
      const nakyy = (p, m) => p.x > -m && p.y > -m && p.x < w + m && p.y < h + m;
      const nimet = nak.s * pohja.S / pohja.k.ruutu > 0.05;   // nimet, kun 1 km ≥ 50 px

      // oma luotaus syvyyskartassa: mistä mitattu syvyys on (ohut ja himmeä, kuten aaltokortissa v176)
      if (pohja.naytto === 'syvyys' && typeof omaLuotausPisteet === 'function') {
        ctx.fillStyle = 'rgba(45,18,80,.28)';
        const P = omaLuotausPisteet(), askel = mPerPx() > 8 ? 3 : 1;
        for (let n = 0; n < P.length; n += askel) {
          const q = naytolle(P[n].lat, P[n].lon); if (q.x < -2 || q.y < -2 || q.x > w + 2 || q.y > h + 2) continue;
          ctx.fillRect(q.x - 1, q.y - 1, 2, 2);
        }
      }
      // omat merkinnät ja ottipaikat (Lappajärvi)
      if (avain === 'lappajarvi') {
        if (typeof omatMerkinnat !== 'undefined') omatMerkinnat.forEach(m => {
          const p = naytolle(m.lat, m.lon); if (!nakyy(p, 20)) return;
          ctx.beginPath(); ctx.arc(p.x, p.y, 4.5, 0, 6.2832); ctx.fillStyle = '#ffb020'; ctx.fill(); ctx.lineWidth = 1.5; ctx.strokeStyle = '#040a12'; ctx.stroke();
          if (nimet && nak.s * pohja.S / pohja.k.ruutu > 0.12) teksti(m.t.length > 22 ? m.t.slice(0, 21) + '…' : m.t, p.x + 7, p.y, '#ffd27a', 12);
        });
        if (typeof lappajarviHotspots !== 'undefined') Object.values(lappajarviHotspots).forEach(hs => {
          const p = naytolle(hs.lat, hs.lon); if (!nakyy(p, 20)) return;
          salmiakki(p.x, p.y, 6.5); ctx.fillStyle = '#ff4d6d'; ctx.fill(); ctx.lineWidth = 1.5; ctx.strokeStyle = '#040a12'; ctx.stroke();
          if (nimet) teksti(hs.name, p.x + 9, p.y, '#ffc2cc', 13);
        });
      }

      // v186: kuha- ja taimenpaikat etusivun analyysista (samat merkit kuin aaltokortissa)
      PAIKKALAJIT.forEach(laji => {
        if (!as[laji]) return; const { K } = paikkaKartta(laji); if (!K) return;
        K.kohteet.forEach(q => { const p = naytolle(q.lat, q.lon); if (nakyy(p, 20)) paikkaMerkki(laji, q, p.x, p.y); });
      });

      const K = (as.kloonit && kerros && kerros.avain === avain) ? kerros : null;
      // päivän saaliit (v180): pieni pallo lajin värillä; saalis, jolla on klooni-isku, näkyy iskuna (punainen pallo)
      saaliit.forEach(x => {
        if (K && K.iskut.some(I => I.lat === x.lat && I.lon === x.lon)) return;
        const p = naytolle(x.lat, x.lon); if (!nakyy(p, 40)) return;
        ctx.beginPath(); ctx.arc(p.x, p.y, 6.5, 0, 6.2832); ctx.fillStyle = 'rgba(255,255,255,.95)'; ctx.fill();
        ctx.beginPath(); ctx.arc(p.x, p.y, 4.5, 0, 6.2832); ctx.fillStyle = LAJIVARI[x.laji] || '#9aa7b8'; ctx.fill();
        if (nimet) teksti((KLOONI_LAJINIMI[x.laji] || x.laji || '?') + ' ' + klooniKello(Date.parse(x.aika)), p.x + 9, p.y, '#ffe0a3', 12);
      });

      // kloonit ja iskut
      if (K) {
        ctx.save();
        K.iskut.forEach(I => {
          const a = naytolle(I.lat, I.lon);
          if (I.tunnus === K.aktiivinen && I.sadeM) {
            ctx.setLineDash([7, 6]); ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(183,148,255,.6)';
            ctx.beginPath(); ctx.arc(a.x, a.y, I.sadeM / mPerPx(), 0, 6.2832); ctx.stroke();
          }
          ctx.setLineDash([3, 5]); ctx.lineWidth = 1.4; ctx.strokeStyle = 'rgba(183,148,255,.75)';
          ctx.beginPath(); I.kloonit.forEach(c => { const b = naytolle(c.lat, c.lon); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); }); ctx.stroke();
        });
        ctx.restore();
        K.iskut.forEach(I => I.kloonit.forEach(c => {
          const p = naytolle(c.lat, c.lon); if (!nakyy(p, 60)) return;
          if (c.tunnus === K.seuraava) { ctx.beginPath(); ctx.arc(p.x, p.y, 16, 0, 6.2832); ctx.lineWidth = 3; ctx.strokeStyle = '#f5b700'; ctx.stroke(); }
          salmiakki(p.x, p.y, 11); ctx.fillStyle = 'rgba(255,255,255,.95)'; ctx.fill();
          salmiakki(p.x, p.y, 8.5); ctx.fillStyle = c.osuma ? '#f5b700' : c.kayty ? '#c4b5fd' : '#7c3aed'; ctx.fill();
          teksti(c.tunnus + ' ' + c.pisteet + '%', p.x + 14, p.y, '#d9c7ff', 15);
        }));
        K.iskut.forEach(I => {
          const p = naytolle(I.lat, I.lon); if (!nakyy(p, 60)) return;
          ctx.beginPath(); ctx.arc(p.x, p.y, 9, 0, 6.2832); ctx.fillStyle = 'rgba(255,255,255,.95)'; ctx.fill();
          ctx.beginPath(); ctx.arc(p.x, p.y, 6.5, 0, 6.2832); ctx.fillStyle = '#d7263d'; ctx.fill();
          teksti(I.tunnus + (I.lajiNimi ? ' ' + I.lajiNimi : ''), p.x + 12, p.y, '#ffb3bf', 14);
        });
      }

      // oma sijainti: vana, viiva seuraavaan kohteeseen, tarkkuus, ennusteviiva ja vene kulkusuuntaan
      if (oma) {
        const p = naytolle(oma.lat, oma.lon);
        utPiirraVana(ctx, { oma, naytolle, mPerPx: mPerPx() });   // v185: vene.js
        const s = K && K.seur && K.seur.gps ? K.seur : null;
        if (s) {
          const b = naytolle(s.c.lat, s.c.lon);
          ctx.save(); ctx.setLineDash([9, 7]); ctx.lineWidth = 2.6; ctx.strokeStyle = '#f5b700';
          ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(b.x, b.y); ctx.stroke(); ctx.restore();
        }
        // tarkkuusympyrä, ennusteviiva (suunta tuore) ja vene kulkusuuntaan (haalea, jos suunta vanha; pyöreä, jos ei suuntaa)
        utPiirraVeneMerkki(ctx, { oma, p, mPerPx: mPerPx(), yo: as.yo });   // v185: vene.js
      }

      // v181: lähtöpaikka (päivän suunnitelman siirtymä ja paluu)
      const lp = (typeof lahtopaikkaLue === 'function') ? lahtopaikkaLue(avain) : null;
      if (lp) {
        const q = naytolle(lp.lat, lp.lon);
        if (nakyy(q, 30)) { ctx.beginPath(); ctx.arc(q.x, q.y, 11, 0, 6.2832); ctx.fillStyle = 'rgba(255,255,255,.95)'; ctx.fill();
          ctx.font = '700 15px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#0b2f55'; ctx.fillText('⚓', q.x, q.y + 1);
          if (nimet) teksti('lähtöpaikka', q.x + 14, q.y, '#cfe3ff', 12); }
      }

      // mittakaava ja pohjoinen
      const m = mPerPx(), tavoite = 110 * m, porr = [50, 100, 200, 250, 500, 1000, 2000, 2500, 5000, 10000];
      const pit = porr.find(x => x >= tavoite * 0.6) || 10000, px = pit / m, y0 = h - 34;
      ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(4,10,18,.85)'; ctx.beginPath(); ctx.moveTo(w - 14 - px, y0); ctx.lineTo(w - 14, y0); ctx.stroke();
      ctx.lineWidth = 2; ctx.strokeStyle = '#E7EEF6'; ctx.beginPath(); ctx.moveTo(w - 14 - px, y0 - 5); ctx.lineTo(w - 14 - px, y0); ctx.lineTo(w - 14, y0); ctx.lineTo(w - 14, y0 - 5); ctx.stroke();
      teksti(pit >= 1000 ? (pit / 1000) + ' km' : pit + ' m', w - 14 - px, y0 - 13, '#E7EEF6', 13);
      teksti('N ↑', w - 34, 18, '#E7EEF6', 15);
    }

    /* ---------- pohjakuva mallista ---------- */
    let laskee = false;
    function renderoi(sovita) {
      if (typeof window.akRenderoi !== 'function' || laskee) return;
      laskee = true; tila('Lasketaan karttaa…');
      setTimeout(() => {
        try {
          let r = window.akRenderoi({ tila: as.tila, tunti, kerroin: 3 });
          if (r.tila === 'eiEnnustetta') r = window.akRenderoi({ tila: 'syvyys', kerroin: 3 });
          if (r.tila !== 'ok') { tila('Karttaa ei voitu piirtää (' + r.tila + ').'); return; }
          const ennen = pohja; pohja = r;
          if (!nak || sovita || !ennen || ennen.avain !== r.avain) {
            sovitaJarvi();
            if (oma && window.akJarviPisteessa(oma.lat, oma.lon) === avain) keskita(oma.lat, oma.lon, 3000);
          }
          paivitaYla(); paivitaLukemat(); paivitaSelite(); tila(r.ennuste ? '' : 'Ei tuuliennustetta (ei verkkoa?): näytetään syvyyskartta.');
          pyydaPiirto();
        } catch (e) { tila('Virhe kartassa: ' + (e && e.message || e)); }
        finally { laskee = false; }
      }, 20);
    }
    // v181: väriselite samasta piirrosta kuin aaltokortin asteikko; napautus näyttää yksikön ja selityksen
    function paivitaSelite() {
      const el = $('selite');
      if (!pohja || !pohja.asteikko) { el.style.display = 'none'; return; }
      const t = TILAT.find(x => x[0] === pohja.naytto);
      $('seliteNimi').textContent = t ? t[2] : '';
      $('seliteVarit').innerHTML = pohja.asteikko;
      $('seliteYks').textContent = (pohja.yksikko || '') + (pohja.naytto === 'kumpuama' ? '. Pinkki alue: vahva kumpuaminen (Wedderburn), kun etusivun lämpötieto riittää.' : '');
      el.classList.toggle('auki', !!as.selite);
